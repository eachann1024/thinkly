name: Desktop installers

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish installers and update feed after building
        type: boolean
        default: false
      force:
        description: Build and publish even when the package version is unchanged
        type: boolean
        default: false
      expected_sha:
        description: Exact main commit checked by the release CLI
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  prepare:
    name: Select build and publication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      build: ${{ steps.check.outputs.build }}
      publish: ${{ steps.check.outputs.publish }}
      repair: ${{ steps.check.outputs.repair }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      version: ${{ steps.check.outputs.version }}
      auto_bump: ${{ steps.check.outputs.auto_bump }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check version and choose publication
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish == true }}
          FORCE: ${{ inputs.force == true }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/select-desktop-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.check.outputs.should_build == 'true'
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: release-plan.json
          if-no-files-found: error
          retention-days: 5

  source:
    name: Source archive
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Archive exact tracked source
        run: |
          mkdir source-artifact
          git archive --format=tar.gz --prefix=thinkly-source/ HEAD > source-artifact/thinkly-source-${SOURCE_SHA}.tar.gz
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s\n' "$SOURCE_SHA" > source-artifact/COMMIT.txt
          cp BUILD-ARTIFACTS.md LICENSE SOURCE-CODE.md THIRD-PARTY-NOTICES.txt source-artifact/
          cd source-artifact
          sha256sum *.tar.gz > source-${SOURCE_SHA}-SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-${{ env.SOURCE_SHA }}
          path: source-artifact/
          if-no-files-found: error
          retention-days: 30

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [prepare]
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runner: windows-2022
          - platform: win
            arch: arm64
            runner: windows-2022
          - platform: mac
            arch: arm64
            runner: macos-15
          - platform: mac
            arch: x64
            runner: macos-15-intel
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.platform == 'win' && needs.prepare.outputs.publish == 'true' && 180 || 45 }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Verify selected source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-plan-${{ env.SOURCE_SHA }}
          path: .
      - name: Apply effective release version before packaging
        run: node scripts/apply-desktop-release-plan.mjs
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: bun install --frozen-lockfile
      - name: Compile renderer, main and preload
        if: matrix.platform != 'mac' || matrix.arch != 'arm64'
        run: node scripts/run-task.mjs build
      - name: Verify native macOS build and installation
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        run: bun run mac
      - name: Decide Windows signing
        id: signing
        env:
          PLATFORM: ${{ matrix.platform }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          SIGNPATH_TOKEN_SET: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
        run: node scripts/signpath-config.mjs
      - name: Build installers and checksums
        if: steps.signing.outputs.enabled != 'true'
        env:
          CSC_LINK: ${{ needs.prepare.outputs.publish == 'true' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ needs.prepare.outputs.publish == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ needs.prepare.outputs.publish == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          node scripts/prepare-electron-pack.mjs
          node scripts/build-ci-installers.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Build unpacked Windows app for signing
        if: steps.signing.outputs.enabled == 'true'
        run: |
          node scripts/prepare-electron-pack.mjs
          node scripts/build-ci-installers.mjs win ${{ matrix.arch }} --stage=unpacked
      - name: Upload unsigned Windows app exe
        id: upload-unsigned-app
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signpath-app-win-${{ matrix.arch }}-${{ env.SOURCE_SHA }}
          path: dist-signpath/app/
          if-no-files-found: error
          retention-days: 1
      - name: Sign Windows app exe with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ steps.signing.outputs.organizationId }}
          project-slug: ${{ steps.signing.outputs.projectSlug }}
          signing-policy-slug: ${{ steps.signing.outputs.signingPolicySlug }}
          artifact-configuration-slug: ${{ steps.signing.outputs.appArtifactConfigurationSlug }}
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signpath/app-signed
      - name: Build Windows installer from signed app
        if: steps.signing.outputs.enabled == 'true'
        run: node scripts/build-ci-installers.mjs win ${{ matrix.arch }} --stage=installer
      - name: Upload unsigned Windows installer
        id: upload-unsigned-installer
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signpath-installer-win-${{ matrix.arch }}-${{ env.SOURCE_SHA }}
          path: dist-signpath/installer/
          if-no-files-found: error
          retention-days: 1
      - name: Sign Windows installer with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ steps.signing.outputs.organizationId }}
          project-slug: ${{ steps.signing.outputs.projectSlug }}
          signing-policy-slug: ${{ steps.signing.outputs.signingPolicySlug }}
          artifact-configuration-slug: ${{ steps.signing.outputs.installerArtifactConfigurationSlug }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signpath/installer-signed
      - name: Collect signed Windows installer and checksums
        if: steps.signing.outputs.enabled == 'true'
        run: node scripts/build-ci-installers.mjs win ${{ matrix.arch }} --stage=collect
      - name: Verify Arch package installs with dependencies
        if: matrix.platform == 'linux'
        run: |
          docker run --rm -v "$PWD/dist-desktop/ci:/packages:ro" archlinux:base bash -euc '
            pacman -Syu --noconfirm
            pacman -U --noconfirm /packages/*.pacman
            pacman -Q thinkly
            test -f "/opt/Thinkly/resources/app.asar"
            test -x /usr/bin/thinkly
            # Every shared library the binary needs must come from the declared pacman depends.
            ! ldd "/opt/Thinkly/thinkly" | grep "not found"
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: thinkly-${{ matrix.platform }}-${{ matrix.arch }}-${{ env.SOURCE_SHA }}
          path: dist-desktop/ci/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release in source repository
    needs: [prepare, source, build]
    if: needs.prepare.outputs.should_build == 'true' && needs.prepare.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: thinkly-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: downloaded-artifacts/
      - name: Apply effective release version and changelog
        run: |
          cp downloaded-artifacts/release-plan-${SOURCE_SHA}/release-plan.json ./release-plan.json
          node scripts/apply-desktop-release-plan.mjs
      - name: Collect exact build assets for publication
        run: node scripts/collect-release-assets.mjs
      - name: Publish installers, source and update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUTO_BUMP: ${{ needs.prepare.outputs.auto_bump }}
        run: node scripts/publish-release.mjs

  repair:
    name: Repair published download metadata
    needs: [prepare]
    if: needs.prepare.outputs.repair == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: thinkly-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restore manifests from verified published asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: node scripts/repair-desktop-metadata.mjs "$RELEASE_TAG"
