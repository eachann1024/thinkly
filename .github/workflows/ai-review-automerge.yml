# 所有作者的非草稿 PR 都审核；只有 eachann1024 的 PR 可自动合并。
# 审核与合并脚本来自可信默认分支，PR 仅通过 API 读取，不执行 PR 代码。
# workflow_dispatch 只读审核任意 PR，不触发合并、评论或标签。
# 需要仓库 Secret CODEX_AUTH_JSON；审核详情保存在 Actions 摘要与产物中。
name: AI review & auto-merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR 编号（只读审核，支持外部 Fork 和已关闭 PR）'
        required: true
        type: string
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number || format('validation-{0}', inputs.pr_number) }}
  cancel-in-progress: true

env:
  BLOCK_LABEL: needs-human
  ALLOWED_AUTHORS: eachann1024
  ALLOW_CAUTION: "true"
  CHECKS_TIMEOUT_MIN: "20"
  # 敏感路径保留人工审核；无需 bot-automerge 标签。
  PROTECTED_PATHS: ".github/,.pr_agent.toml,.gemini/,.coderabbit.yaml,.greptile/,.env,secrets,credentials,*.pem,*.key,*.p12,id_rsa,deploy/,vercel.json,netlify.toml,fly.toml,wrangler.toml,render.yaml,Dockerfile,docker-compose,compose.yaml,compose.yml,Procfile,publish-release.mjs,publish.mjs,updates/,Casks/"

jobs:
  review:
    name: ai-review
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.pragent.outputs.review }}
    steps:
      - name: Checkout trusted review script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Codex review (ChatGPT login)
        id: pragent
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash .github/codex-review/run.sh > "$RUNNER_TEMP/review.json"
          {
            echo 'review<<REVIEW_JSON_EOF'
            cat "$RUNNER_TEMP/review.json"
            echo 'REVIEW_JSON_EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo '## AI 审核结论'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/review.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: codex-review
          path: ${{ runner.temp }}/review.json
          if-no-files-found: error
          retention-days: 7

  validate:
    name: ai-review-validation
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted review script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve PR
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          pr, repo = os.environ['PR'], os.environ['REPO']
          if not re.fullmatch(r'[1-9][0-9]*', pr):
              raise SystemExit('PR 编号不合法')
          info = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/pulls/{pr}'], text=True))
          sha = info['head']['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('PR 提交不合法')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'sha={sha}\n')
          PY
      - name: Validate Codex review (read-only)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          bash .github/codex-review/run.sh > "$RUNNER_TEMP/validated-review.json"
          {
            echo '## Codex 审核验收'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/validated-review.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-validation
          path: ${{ runner.temp }}/validated-review.json
          if-no-files-found: error
          retention-days: 7

  gate:
    name: ai-merge-gate
    needs: review
    # 作者限制与脚本内实时检查双重保护；手动审核与外部作者绝不进入合并任务。
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'eachann1024' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    steps:
      - name: Checkout trusted merge script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Decide and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_JSON: ${{ needs.review.outputs.review }}
        run: python3 .github/codex-review/merge.py
