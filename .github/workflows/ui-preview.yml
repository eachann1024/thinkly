name: PR UI preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "electron/**"
      - "config/vite/**"
      - "public/**"
      - "scripts/**"
      - "*.html"
      - "vite*"
      - "package.json"
      - "bun.lock"
      - ".github/ui-preview/**"
      - ".github/workflows/ui-preview*.yml"
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (empty records the selected main commit)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ui-preview-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      number: ${{ steps.prepare.outputs.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr }}
        run: node .github/ui-preview/prepare.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-preview-input
          path: preview-input.json
          retention-days: 7

  record:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      SOURCE_SHA: ${{ matrix.sha }}
      PREVIEW_VARIANT: ${{ matrix.variant }}
    steps:
      # Tools come from the base commit. The PR runs without secrets or write permissions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: tools
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.sha }}
          path: app
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-preview-input
          path: input
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install desktop libraries and recorder
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox fonts-noto-cjk fonts-noto-color-emoji libgtk-3-0 libnss3 libasound2t64 libgbm1 libatk-bridge2.0-0 libxss1
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/.github/ui-preview
      - name: Install app dependencies
        id: install
        working-directory: app
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bun install --frozen-lockfile
          ELECTRON_SKIP_BINARY_DOWNLOAD= node node_modules/electron/install.js
      - name: Build desktop app
        id: build
        working-directory: app
        run: bun run build:electron
      - name: Record real desktop interactions
        id: record
        env:
          PREVIEW_INPUT: ${{ github.workspace }}/input/preview-input.json
        run: |
          xvfb-run -a -s "-screen 0 1440x1000x24" sh -c '
            openbox >/tmp/goose-preview-window-manager.log 2>&1 &
            node tools/.github/ui-preview/record.mjs app out
          '
      - name: Write evidence report
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RECORD_OUTCOME: ${{ steps.record.outcome }}
        run: node tools/.github/ui-preview/report.mjs out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-preview-pr-${{ needs.prepare.outputs.number }}-${{ matrix.variant }}-${{ matrix.sha }}
          path: out
          if-no-files-found: error
          retention-days: 14
