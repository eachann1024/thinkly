name: PR UI preview report

on:
  workflow_run:
    workflows: ["PR UI preview"]
    types: [completed]

permissions: {}

concurrency:
  group: ui-preview-report-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # This job only reads GitHub metadata; it never downloads or executes PR artifacts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/ui-preview/publish.mjs
