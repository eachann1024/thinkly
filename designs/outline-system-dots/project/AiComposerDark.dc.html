<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 输入区 · 深色窄面板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible{outline:none;background:#343434}button:hover{background:#343434}textarea:focus{outline:none}textarea::placeholder{color:#c3c2b7;opacity:1}::selection{background:#343434;color:#f0efec}</style></helmet>
<div style="width:340px;height:240px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;background:#222222;color:#f0efec;font-family:Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:20px">
  <div style="display:flex;flex-direction:column;gap:12px;padding:12px;box-sizing:border-box;border:1px solid #666660;border-radius:9px;background:#272727">
    <textarea rows="3" aria-label="向 AI 提问" placeholder="向 AI 提问，/ 调用指令或 Skill，@ 引用笔记或本地文件…" style="display:block;box-sizing:border-box;width:100%;min-height:78px;resize:none;border:0;padding:2px 2px 10px;background:transparent;color:#f0efec;font-size:14px;line-height:22px;caret-color:#779de8"></textarea>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0">
      <div style="display:flex;align-items:center;gap:4px;min-width:0">
        <button type="button" aria-label="上传图片" title="上传图片" style="display:flex;align-items:center;justify-content:center;flex:0 0 44px;width:44px;height:44px;border:0;border-radius:8px;background:transparent;color:#c3c2b7;padding:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        <button type="button" aria-label="选择模型，当前 Claude Opus 4.6 Thinking" title="Claude Opus 4.6 (Thinking)" style="display:flex;align-items:center;gap:6px;min-width:0;height:44px;padding:0 6px;border:0;border-radius:8px;background:transparent;color:#c3c2b7;font-size:13px;line-height:20px;white-space:nowrap"><span style="min-width:0;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(to right,#fff calc(100% - 12px),transparent)">Claude Opus 4.6 (Thinking)</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
      </div>
      <button type="button" aria-label="发送消息" disabled="disabled" style="display:flex;align-items:center;justify-content:center;flex:0 0 44px;width:44px;height:44px;padding:0;border:1px solid #55554f;border-radius:8px;background:#30302e;color:#aaa99e;cursor:default"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":340,"height":240}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
