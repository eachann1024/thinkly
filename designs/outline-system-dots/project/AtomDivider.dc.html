<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>分割线 · 默认 / 悬停 / 选中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}@keyframes gooseCaretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}.goose-fake-caret{animation:gooseCaretBlink 1.06s steps(1) infinite}</style></helmet>
<div style="width:1120px;height:560px;box-sizing:border-box;display:grid;grid-template-rows:1fr 1fr;background:#f1f1f1;font-family:Inter,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:22px">

  <!-- Light -->
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#e4e4e4">
    <div style="display:flex;flex-direction:column;gap:12px;padding:20px 24px 0 72px;background:#ffffff;color:#20242c">
      <span style="margin-left:-48px;font-size:12px;line-height:16px;color:#526071">默认</span>
      <p style="margin:0">把讨论记录整理成两段。</p>
      <div style="display:flex;align-items:center;height:28px"><div style="flex:1;height:0;border-top:1px solid #dfe2e6"></div></div>
      <p style="margin:0">第二部分从结论开始。</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;padding:20px 24px 0 72px;background:#ffffff;color:#20242c">
      <span style="margin-left:-48px;font-size:12px;line-height:16px;color:#526071">悬停</span>
      <p style="margin:0">把讨论记录整理成两段。</p>
      <div style="position:relative;display:flex;align-items:center;height:28px">
        <div style="position:absolute;left:-60px;top:2px;display:flex;align-items:center;gap:6px;height:24px;padding:0 6px;box-sizing:border-box;border:1px solid #e1e3e6;border-radius:7px;background:#ffffff;box-shadow:0 1px 2px rgba(20,24,32,0.08);color:#20242c"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2 6h8"></path></svg><svg width="8" height="12" viewBox="0 0 8 12" fill="#526071" aria-hidden="true"><circle cx="2" cy="2" r="1"></circle><circle cx="6" cy="2" r="1"></circle><circle cx="2" cy="6" r="1"></circle><circle cx="6" cy="6" r="1"></circle><circle cx="2" cy="10" r="1"></circle><circle cx="6" cy="10" r="1"></circle></svg></div>
        <div style="flex:1;height:0;border-top:1px solid #dfe2e6"></div>
      </div>
      <p style="margin:0">第二部分从结论开始。</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;padding:20px 24px 0 72px;background:#ffffff;color:#20242c">
      <span style="margin-left:-48px;font-size:12px;line-height:16px;color:#526071">选中</span>
      <p style="margin:0">把讨论记录整理成两段。</p>
      <div style="position:relative;display:flex;align-items:center;height:28px;border-radius:4px;background:#f0f3fb;box-shadow:7px 0 0 #f0f3fb,-7px 0 0 #f0f3fb">
        <div style="position:absolute;top:0;bottom:0;left:-8px;right:-8px;border:1px solid #547dd0;border-radius:4px;pointer-events:none"></div>
        <div style="position:absolute;left:-60px;top:2px;display:flex;align-items:center;gap:6px;height:24px;padding:0 6px;box-sizing:border-box;border:1px solid #e1e3e6;border-radius:7px;background:#ffffff;box-shadow:0 1px 2px rgba(20,24,32,0.08);color:#20242c"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2 6h8"></path></svg><svg width="8" height="12" viewBox="0 0 8 12" fill="#526071" aria-hidden="true"><circle cx="2" cy="2" r="1"></circle><circle cx="6" cy="2" r="1"></circle><circle cx="2" cy="6" r="1"></circle><circle cx="6" cy="6" r="1"></circle><circle cx="2" cy="10" r="1"></circle><circle cx="6" cy="10" r="1"></circle></svg></div>
        <div style="flex:1;height:0;border-top:1px solid {{lineLight}}"></div>
        <div class="goose-fake-caret" style="display:{{caretDisplay}};width:2px;height:18px;margin-left:4px;border-radius:1px;background:#547dd0"></div>
      </div>
      <p style="margin:0">第二部分从结论开始。</p>
    </div>
  </div>

  <!-- Dark -->
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#2a2a2a;border-top:1px solid #2a2a2a">
    <div style="display:flex;flex-direction:column;gap:12px;padding:20px 24px 0 72px;background:#181818;color:#ececec">
      <span style="margin-left:-48px;font-size:12px;line-height:16px;color:#b4b4b4">默认</span>
      <p style="margin:0">把讨论记录整理成两段。</p>
      <div style="display:flex;align-items:center;height:28px"><div style="flex:1;height:0;border-top:1px solid #353535"></div></div>
      <p style="margin:0">第二部分从结论开始。</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;padding:20px 24px 0 72px;background:#181818;color:#ececec">
      <span style="margin-left:-48px;font-size:12px;line-height:16px;color:#b4b4b4">悬停</span>
      <p style="margin:0">把讨论记录整理成两段。</p>
      <div style="position:relative;display:flex;align-items:center;height:28px">
        <div style="position:absolute;left:-60px;top:2px;display:flex;align-items:center;gap:6px;height:24px;padding:0 6px;box-sizing:border-box;border:1px solid #3a3a3a;border-radius:7px;background:#222222;color:#ececec"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2 6h8"></path></svg><svg width="8" height="12" viewBox="0 0 8 12" fill="#b4b4b4" aria-hidden="true"><circle cx="2" cy="2" r="1"></circle><circle cx="6" cy="2" r="1"></circle><circle cx="2" cy="6" r="1"></circle><circle cx="6" cy="6" r="1"></circle><circle cx="2" cy="10" r="1"></circle><circle cx="6" cy="10" r="1"></circle></svg></div>
        <div style="flex:1;height:0;border-top:1px solid #353535"></div>
      </div>
      <p style="margin:0">第二部分从结论开始。</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;padding:20px 24px 0 72px;background:#181818;color:#ececec">
      <span style="margin-left:-48px;font-size:12px;line-height:16px;color:#b4b4b4">选中</span>
      <p style="margin:0">把讨论记录整理成两段。</p>
      <div style="position:relative;display:flex;align-items:center;height:28px;border-radius:4px;background:#21242b;box-shadow:7px 0 0 #21242b,-7px 0 0 #21242b">
        <div style="position:absolute;top:0;bottom:0;left:-8px;right:-8px;border:1px solid #779de8;border-radius:4px;pointer-events:none"></div>
        <div style="position:absolute;left:-60px;top:2px;display:flex;align-items:center;gap:6px;height:24px;padding:0 6px;box-sizing:border-box;border:1px solid #3a3a3a;border-radius:7px;background:#222222;color:#ececec"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2 6h8"></path></svg><svg width="8" height="12" viewBox="0 0 8 12" fill="#b4b4b4" aria-hidden="true"><circle cx="2" cy="2" r="1"></circle><circle cx="6" cy="2" r="1"></circle><circle cx="2" cy="6" r="1"></circle><circle cx="6" cy="6" r="1"></circle><circle cx="2" cy="10" r="1"></circle><circle cx="6" cy="10" r="1"></circle></svg></div>
        <div style="flex:1;height:0;border-top:1px solid {{lineDark}}"></div>
        <div class="goose-fake-caret" style="display:{{caretDisplay}};width:2px;height:18px;margin-left:4px;border-radius:1px;background:#779de8"></div>
      </div>
      <p style="margin:0">第二部分从结论开始。</p>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tintLine":{"editor":"boolean","default":true,"label":"选中时线条着色"},"showCaret":{"editor":"boolean","default":false,"label":"行尾闪烁光标"},"$preview":{"width":1120,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const tint = this.props.tintLine ?? true;
    const caret = this.props.showCaret ?? false;
    return {
      lineLight: tint ? '#9fb6e5' : '#dfe2e6',
      lineDark: tint ? '#4f6799' : '#353535',
      caretDisplay: caret ? 'block' : 'none'
    };
  }
}
</script>
</body>
</html>
