<helmet><style>body{margin:0}.goose-dm {
  --dm-ease: cubic-bezier(0.45, 0, 0.55, 1);
  --dm-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dm-loop-ease: steps(2, end);
  overflow: visible;
  transform-box: view-box;
  transform-origin: var(--dm-ox, 50%) var(--dm-oy, 50%);
}
.goose-dm-corner {
  --dm-loop-low: 0.92;
}

.goose-dm[data-dm-phase="in"].goose-dm-main {
  animation: goose-dm-main-drift 12s var(--dm-loop-ease) -6s infinite both;
}
.goose-dm[data-dm-phase="in"].goose-dm-small {
  animation: goose-dm-small-drift 11s var(--dm-loop-ease) -5.5s infinite both;
}
.goose-dm[data-dm-phase="in"].goose-dm-corner {
  animation: goose-dm-corner-drift 14s var(--dm-loop-ease) -7s infinite both;
}
@keyframes goose-dm-main-drift {
  0%,
  100% {
    transform: translateY(0) scale(1);
  }
  50% {
    transform: translateY(-0.65px) scale(1.006);
  }
}
@keyframes goose-dm-small-drift {
  0%,
  100% {
    transform: translateY(0) scale(1);
  }
  50% {
    transform: translateY(-0.35px) scale(1.006);
  }
}
@keyframes goose-dm-corner-drift {
  0%,
  100% {
    transform: translateY(0) scale(1);
  }
  50% {
    transform: translateY(-0.35px) scale(1.004);
  }
}

.goose-dm .goose-dm-rg {
  transform-box: view-box;
  transform-origin: var(--dm-ox, 50%) var(--dm-oy, 50%);
}
.goose-dm[data-dm-phase="pre"] .goose-dm-rg {
  opacity: 0;
}
.goose-dm[data-dm-phase="in"]:not([data-dm-played]) .goose-dm-rg {
  animation: goose-dm-enter 360ms var(--dm-ease-out) calc(var(--dm-i, 0) * 28ms)
    backwards;
}
@keyframes goose-dm-enter {
  from {
    opacity: 0;
    transform: scale(0.985);
  }
}

.goose-dm .goose-dm-glint,
.goose-dm .goose-dm-wave,
.goose-dm .goose-dm-alert {
  transform-box: fill-box;
  transform-origin: center;
}
.goose-dm[data-dm-phase="in"] .goose-dm-breathe {
  animation: goose-dm-breathe var(--dm-period, 12s) var(--dm-loop-ease)
    var(--dm-delay, -6s) infinite both;
}
.goose-dm[data-dm-phase="in"] .goose-dm-ripple {
  animation: goose-dm-ripple var(--dm-period, 12s) var(--dm-loop-ease)
    var(--dm-delay, -6s) infinite both;
}
.goose-dm[data-dm-phase="in"] .goose-dm-glint {
  animation: goose-dm-glint var(--dm-period, 9s) var(--dm-loop-ease)
    var(--dm-delay, -7s) infinite both;
}
.goose-dm[data-dm-phase="in"] .goose-dm-flow {
  animation: goose-dm-flow var(--dm-period, 10s) var(--dm-loop-ease)
    var(--dm-delay, -5s) infinite both;
}
.goose-dm[data-dm-phase="in"] .goose-dm-wave {
  animation: goose-dm-wave var(--dm-period, 10s) var(--dm-loop-ease)
    var(--dm-delay, -5s) infinite both;
}
.goose-dm[data-dm-phase="in"] .goose-dm-progress {
  animation: goose-dm-progress var(--dm-period, 4s) var(--dm-loop-ease)
    var(--dm-delay, -2s) infinite both;
}
.goose-dm[data-dm-phase="in"] .goose-dm-alert {
  animation:
    goose-dm-shake 280ms cubic-bezier(0.36, 0.07, 0.19, 0.97)
      var(--dm-alert-delay, 0.4s) 1 backwards,
    goose-dm-breathe var(--dm-period, 10s) var(--dm-loop-ease) var(--dm-delay, -6s)
      infinite both;
}

@keyframes goose-dm-breathe {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: var(--dm-loop-low, 0.9);
  }
}
@keyframes goose-dm-ripple {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: var(--dm-loop-low, 0.9);
  }
}
@keyframes goose-dm-glint {
  0%,
  100% {
    opacity: 1;
    transform: scale(1);
  }
  28% {
    opacity: 0.92;
  }
  68% {
    opacity: 0.96;
    transform: scale(1.006);
  }
}
@keyframes goose-dm-flow {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.94;
  }
}
@keyframes goose-dm-wave {
  0%,
  100% {
    transform: translateY(-0.35px);
  }
  50% {
    transform: translateY(0.35px);
  }
}
@keyframes goose-dm-progress {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: var(--dm-progress-low, 0.9);
  }
}
@keyframes goose-dm-shake {
  25% {
    transform: translateX(-0.8px);
  }
  50% {
    transform: translateX(0.8px);
  }
  75% {
    transform: translateX(-0.4px);
  }
}

.goose-dm[data-dm-paused] * {
  animation-play-state: paused !important;
}
.goose-dm[data-dm-paused] {
  animation-play-state: paused !important;
}

@media (prefers-reduced-motion: reduce) {
  .goose-dm * {
    animation: none !important;
  }
  .goose-dm {
    animation: none !important;
  }
  .goose-dm .goose-dm-rg {
    opacity: 1;
  }
}

.goose-dm-decor {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  container-type: size;
}
.goose-dm-decor-item {
  display: none;
}
.goose-dm-decor-item > .goose-dm {
  transform-origin: var(--dm-decor-o, center);
}
.goose-dm-decor-item[data-at="tl"] {
  --dm-decor-o: left top;
}
.goose-dm-decor-item[data-at="tr"] {
  --dm-decor-o: right top;
}
.goose-dm-decor-item[data-at="bl"] {
  --dm-decor-o: left bottom;
}
.goose-dm-decor-item[data-at="br"] {
  --dm-decor-o: right bottom;
}
@container (min-width: 220px) and (min-height: 220px) {
  .goose-dm-decor[data-decor="area"] > .goose-dm-decor-item:not([data-minor]) {
    display: block;
  }
}
@container (min-width: 440px) and (min-height: 320px) {
  .goose-dm-decor[data-decor="area"] > .goose-dm-decor-item {
    display: block;
  }
}
@container (min-width: 220px) and (min-height: 96px) {
  .goose-dm-decor[data-decor="compact"]
    > .goose-dm-decor-item:not([data-minor]) {
    display: block;
  }
}
@container (min-width: 380px) and (min-height: 96px) {
  .goose-dm-decor[data-decor="compact"] > .goose-dm-decor-item {
    display: block;
  }
}
@container (max-width: 359px) {
  .goose-dm-decor-item > .goose-dm {
    scale: 0.72;
  }
}
.goose-empty-art-ink{fill:currentColor}.goose-empty-art-accent{fill:var(--goose-accent-solid)}.goose-empty-art-danger{fill:var(--goose-color-danger)}.goose-empty-art-soft{opacity:.24}.goose-empty-art-secondary{opacity:.5}.goose-empty-art-body{opacity:.8}.review-paused *{animation-play-state:paused!important}</style></helmet>
