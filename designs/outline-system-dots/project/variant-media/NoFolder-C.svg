<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 208" width="320" height="208" style="--ink:#1f1e1d;--accent:#547dd0;--danger:#b42318;background:#fafafa" role="img" aria-label="未关联本地文件夹 C"><style>
.alt-motion{animation-duration:var(--period,12s);animation-delay:var(--delay,0s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-box:view-box;transform-origin:var(--origin,160px 104px)}
.alt-breathe{animation-name:alt-breathe}.alt-rise{animation-name:alt-rise}.alt-sway{animation-name:alt-sway}.alt-ripple{animation-name:alt-ripple}
@keyframes alt-breathe{0%,100%{opacity:1}50%{opacity:var(--low,.55)}}
@keyframes alt-rise{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:var(--low,.55);transform:translateY(calc(-1 * var(--amplitude,1.2px)))}}
@keyframes alt-sway{0%,100%{opacity:1;transform:translateX(0)}50%{opacity:var(--low,.55);transform:translateX(var(--amplitude,1.2px))}}
@keyframes alt-ripple{0%,100%{opacity:var(--low,.55);transform:scale(.992)}50%{opacity:1;transform:scale(1.008)}}
.variants-paused .alt-motion,[data-offscreen] .alt-motion{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.alt-motion{animation:none!important;transform:none!important;opacity:1!important}}
</style><g class="alt-motion alt-rise" style="--period:12s;--delay:-0s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M30 139 L30 172 L88 172" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-2.4s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M20 150 L20 186 L111 186" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-4.8s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M290 65 L290 35 L232 35" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-7.2s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M301 55 L301 22 L210 22" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-9.6s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M111 195 L209 195" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g transform="translate(80.64 44.48) scale(1.24)"><g><path d="M30 40V23Q30 18 35 18H57.74L65.77 27H99Q103 27 103 31V40" fill="none" stroke="var(--ink)" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/><path d="M25 41 L109 41 L100 74 L34 74 L25 41" fill="none" stroke="var(--ink)" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-4s;--low:0.8;--amplitude:1.2px;--origin:64px 48px"><path d="M19 73 L19 84 L112 84 L112 73" fill="none" stroke="var(--ink)" stroke-opacity="0.32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g><g class="alt-motion alt-breathe" style="--period:6s;--delay:-1s;--low:0.55;--amplitude:1.2px;--origin:64px 48px"><circle cx="12" cy="81" r="1.5" fill="var(--accent)" opacity="1"/><circle cx="19" cy="81" r="1.5" fill="var(--accent)" opacity="1"/><circle cx="26" cy="81" r="1.5" fill="var(--accent)" opacity="1"/></g></g></svg>