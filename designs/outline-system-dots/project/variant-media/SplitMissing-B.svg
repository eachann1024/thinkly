<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 208" width="320" height="208" style="--ink:#1f1e1d;--accent:#547dd0;--danger:#b42318;background:#fafafa" role="img" aria-label="分屏笔记缺失 B"><style>
.alt-motion{animation-duration:var(--period,12s);animation-delay:var(--delay,0s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-box:view-box;transform-origin:var(--origin,160px 104px)}
.alt-breathe{animation-name:alt-breathe}.alt-rise{animation-name:alt-rise}.alt-sway{animation-name:alt-sway}.alt-ripple{animation-name:alt-ripple}
@keyframes alt-breathe{0%,100%{opacity:1}50%{opacity:var(--low,.55)}}
@keyframes alt-rise{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:var(--low,.55);transform:translateY(calc(-1 * var(--amplitude,1.2px)))}}
@keyframes alt-sway{0%,100%{opacity:1;transform:translateX(0)}50%{opacity:var(--low,.55);transform:translateX(var(--amplitude,1.2px))}}
@keyframes alt-ripple{0%,100%{opacity:var(--low,.55);transform:scale(.992)}50%{opacity:1;transform:scale(1.008)}}
.variants-paused .alt-motion,[data-offscreen] .alt-motion{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.alt-motion{animation:none!important;transform:none!important;opacity:1!important}}
</style><g class="alt-motion alt-sway" style="--period:12s;--delay:-0s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M15 65 L47 65 L47 89 L77 89" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-sway" style="--period:12s;--delay:-3s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M15 141 L47 141 L47 117 L77 117" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-sway" style="--period:12s;--delay:-6s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M305 65 L273 65 L273 89 L243 89" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-sway" style="--period:12s;--delay:-9s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M305 141 L273 141 L273 117 L243 117" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g transform="translate(80.64 44.48) scale(1.24)"><g><path d="M17 23H41L49 31V73Q49 76 46 76H17Q14 76 14 73V26Q14 23 17 23" fill="none" stroke="var(--ink)" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/><path d="M41 26 L41 31 L46 31" fill="none" stroke="var(--ink)" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g><g class="alt-motion alt-breathe" style="--period:12s;--delay:-3s;--low:0.8;--amplitude:1.2px;--origin:64px 48px"><path d="M74 30 L74 20 L113 20 L113 31" fill="none" stroke="var(--ink)" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/><path d="M74 67 L74 78 L113 78 L113 66" fill="none" stroke="var(--ink)" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g><g class="alt-motion alt-breathe" style="--period:6s;--delay:-4s;--low:0.55;--amplitude:1.2px;--origin:64px 48px"><path d="M88.15 39.95Q88.6 34.1 94 34.1Q102.1 34.1 100.3 41.3Q100.3 44.9 94 46.7V48.5" fill="none" stroke="var(--accent)" stroke-opacity="0.95" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.1"/><circle cx="94" cy="52.82" r="1.4" fill="var(--accent)" opacity="1"/></g></g></svg>