<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 208" width="320" height="208" style="--ink:#1f1e1d;--accent:#547dd0;--danger:#b42318;background:#fafafa" role="img" aria-label="未打开笔记 B"><style>
.alt-motion{animation-duration:var(--period,12s);animation-delay:var(--delay,0s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-box:view-box;transform-origin:var(--origin,160px 104px)}
.alt-breathe{animation-name:alt-breathe}.alt-rise{animation-name:alt-rise}.alt-sway{animation-name:alt-sway}.alt-ripple{animation-name:alt-ripple}
@keyframes alt-breathe{0%,100%{opacity:1}50%{opacity:var(--low,.55)}}
@keyframes alt-rise{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:var(--low,.55);transform:translateY(calc(-1 * var(--amplitude,1.2px)))}}
@keyframes alt-sway{0%,100%{opacity:1;transform:translateX(0)}50%{opacity:var(--low,.55);transform:translateX(var(--amplitude,1.2px))}}
@keyframes alt-ripple{0%,100%{opacity:var(--low,.55);transform:scale(.992)}50%{opacity:1;transform:scale(1.008)}}
.variants-paused .alt-motion,[data-offscreen] .alt-motion{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.alt-motion{animation:none!important;transform:none!important;opacity:1!important}}
</style><g class="alt-motion alt-ripple" style="--period:12s;--delay:-0s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M12 60Q45 42 77 57M12 78Q45 60 77 75M12 96Q45 78 77 93" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-ripple" style="--period:12s;--delay:-6s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M308 150Q276 168 243 152M308 132Q276 150 243 134M308 114Q276 132 243 116" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g transform="translate(80.64 44.48) scale(1.24)"><g><path d="M64 24Q43 10 11 18V78Q43 70 64 84Q87 70 118 78V18Q87 10 64 24V84" fill="none" stroke="var(--ink)" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g><g><path d="M17 83Q43 77 62 89M68 89Q88 77 113 83" fill="none" stroke="var(--ink)" stroke-opacity="0.32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g><g class="alt-motion alt-breathe" style="--period:6s;--delay:-4s;--low:0.55;--amplitude:1.2px;--origin:64px 48px"><circle cx="90" cy="79" r="1.4" fill="var(--accent)" opacity="1"/><circle cx="95" cy="78" r="1.4" fill="var(--accent)" opacity="1"/><circle cx="100" cy="78" r="1.4" fill="var(--accent)" opacity="1"/></g></g></svg>