<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 208" width="320" height="208" style="--ink:#1f1e1d;--accent:#547dd0;--danger:#b42318;background:#fafafa" role="img" aria-label="未打开笔记 A"><style>
.alt-motion{animation-duration:var(--period,12s);animation-delay:var(--delay,0s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-box:view-box;transform-origin:var(--origin,160px 104px)}
.alt-breathe{animation-name:alt-breathe}.alt-rise{animation-name:alt-rise}.alt-sway{animation-name:alt-sway}.alt-ripple{animation-name:alt-ripple}
@keyframes alt-breathe{0%,100%{opacity:1}50%{opacity:var(--low,.55)}}
@keyframes alt-rise{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:var(--low,.55);transform:translateY(calc(-1 * var(--amplitude,1.2px)))}}
@keyframes alt-sway{0%,100%{opacity:1;transform:translateX(0)}50%{opacity:var(--low,.55);transform:translateX(var(--amplitude,1.2px))}}
@keyframes alt-ripple{0%,100%{opacity:var(--low,.55);transform:scale(.992)}50%{opacity:1;transform:scale(1.008)}}
.variants-paused .alt-motion,[data-offscreen] .alt-motion{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.alt-motion{animation:none!important;transform:none!important;opacity:1!important}}
</style><g class="alt-motion alt-breathe" style="--period:12s;--delay:-0s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M24 57 L24 152 L67 152" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-breathe" style="--period:12s;--delay:-2.4s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M36 66 L36 142 L73 142" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-breathe" style="--period:12s;--delay:-4.8s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M48 77 L48 132 L79 132" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-breathe" style="--period:12s;--delay:-7.2s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M296 57 L296 152 L253 152" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-breathe" style="--period:12s;--delay:-9.6s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M284 66 L284 142 L247 142" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g transform="translate(80.64 44.48) scale(1.24)"><g><path d="M35 8H92Q96 8 96 12V84Q96 88 92 88H35Q31 88 31 84V12Q31 8 35 8" fill="none" stroke="var(--ink)" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/><path d="M43 12 L43 84" fill="none" stroke="var(--ink)" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/><path d="M34 83 L92 83" fill="none" stroke="var(--ink)" stroke-opacity="0.32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g><g class="alt-motion alt-breathe" style="--period:6s;--delay:-2s;--low:0.55;--amplitude:1.2px;--origin:64px 48px"><path d="M75 11 L75 27 L81 23 L87 27 L87 11" fill="none" stroke="var(--accent)" stroke-opacity="1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g></g></svg>