<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 208" width="320" height="208" style="--ink:#1f1e1d;--accent:#547dd0;--danger:#b42318;background:#fafafa" role="img" aria-label="分屏笔记缺失 A"><style>
.alt-motion{animation-duration:var(--period,12s);animation-delay:var(--delay,0s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-box:view-box;transform-origin:var(--origin,160px 104px)}
.alt-breathe{animation-name:alt-breathe}.alt-rise{animation-name:alt-rise}.alt-sway{animation-name:alt-sway}.alt-ripple{animation-name:alt-ripple}
@keyframes alt-breathe{0%,100%{opacity:1}50%{opacity:var(--low,.55)}}
@keyframes alt-rise{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:var(--low,.55);transform:translateY(calc(-1 * var(--amplitude,1.2px)))}}
@keyframes alt-sway{0%,100%{opacity:1;transform:translateX(0)}50%{opacity:var(--low,.55);transform:translateX(var(--amplitude,1.2px))}}
@keyframes alt-ripple{0%,100%{opacity:var(--low,.55);transform:scale(.992)}50%{opacity:1;transform:scale(1.008)}}
.variants-paused .alt-motion,[data-offscreen] .alt-motion{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.alt-motion{animation:none!important;transform:none!important;opacity:1!important}}
</style><g class="alt-motion alt-rise" style="--period:12s;--delay:-0s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M15 78 L15 38 L70 38" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-2s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M29 91 L29 51 L76 51" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-4s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M305 131 L305 171 L250 171" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-6s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M291 118 L291 158 L244 158" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-8s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M158 16 L158 32" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-10s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M158 177 L158 193" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g transform="translate(80.64 44.48) scale(1.24)"><g><path d="M12 17H116Q120 17 120 21V78Q120 82 116 82H12Q8 82 8 78V21Q8 17 12 17" fill="none" stroke="var(--ink)" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/><path d="M59 20 L59 79" fill="none" stroke="var(--ink)" stroke-opacity="0.32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/><path d="M24 31H41Q45 31 45 35V64Q45 68 41 68H24Q20 68 20 64V35Q20 31 24 31" fill="none" stroke="var(--ink)" stroke-opacity="0.28" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g><g><path d="M77 31 L105 31 L105 68 L77 68 L77 31" fill="none" stroke="var(--ink)" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g><g class="alt-motion alt-breathe" style="--period:6s;--delay:-1s;--low:0.55;--amplitude:1.2px;--origin:64px 48px"><path d="M86.45 42.85Q86.8 38.3 91 38.3Q97.3 38.3 95.9 43.9Q95.9 46.7 91 48.1V49.5" fill="none" stroke="var(--accent)" stroke-opacity="0.95" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.1"/><circle cx="91" cy="52.86" r="1.4" fill="var(--accent)" opacity="1"/></g></g></svg>