troke-dasharray=".01 4.5"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-2s;--low:0.8;--amplitude:1.2px;--origin:64px 48px"><path d="M42 10H84L96 22V77Q96 80 93 80H42Q39 80 39 77V13Q39 10 42 10" fill="none" stroke="var(--ink)" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/><path d="M84 13 L84 22 L93 22" fill="none" stroke="var(--ink)" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g><g class="alt-motion alt-breathe" style="--period:6s;--delay:-1s;--low:0.55;--amplitude:1.2px;--origin:64px 48px"><path d="M88 74 L102 74 L102 61" fill="none" stroke="var(--accent)" stroke-opacity="1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g></g></svg>