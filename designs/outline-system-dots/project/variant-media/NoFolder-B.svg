troke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/><path d="M84 51 L116 51" fill="none" stroke="var(--ink)" stroke-opacity="0.32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g><g class="alt-motion alt-breathe" style="--period:6s;--delay:-2s;--low:0.55;--amplitude:1.2px;--origin:64px 48px"><path d="M59 44 L64 44" fill="none" stroke="var(--accent)" stroke-opacity="1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/><path d="M70 44 L74 44" fill="none" stroke="var(--accent)" stroke-opacity="1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g><g class="alt-motion alt-breathe" style="--period:12s;--delay:-7s;--low:0.8;--amplitude:1.2px;--origin:64px 48px"><path d="M58 55 L73 55" fill="none" stroke="var(--ink)" stroke-opacity="0.32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g></g></svg>