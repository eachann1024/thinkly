<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 208" width="320" height="208" style="--ink:#1f1e1d;--accent:#547dd0;--danger:#b42318;background:#fafafa" role="img" aria-label="空文件夹 C"><style>
.alt-motion{animation-duration:var(--period,12s);animation-delay:var(--delay,0s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-box:view-box;transform-origin:var(--origin,160px 104px)}
.alt-breathe{animation-name:alt-breathe}.alt-rise{animation-name:alt-rise}.alt-sway{animation-name:alt-sway}.alt-ripple{animation-name:alt-ripple}
@keyframes alt-breathe{0%,100%{opacity:1}50%{opacity:var(--low,.55)}}
@keyframes alt-rise{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:var(--low,.55);transform:translateY(calc(-1 * var(--amplitude,1.2px)))}}
@keyframes alt-sway{0%,100%{opacity:1;transform:translateX(0)}50%{opacity:var(--low,.55);transform:translateX(var(--amplitude,1.2px))}}
@keyframes alt-ripple{0%,100%{opacity:var(--low,.55);transform:scale(.992)}50%{opacity:1;transform:scale(1.008)}}
.variants-paused .alt-motion,[data-offscreen] .alt-motion{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.alt-motion{animation:none!important;transform:none!important;opacity:1!important}}
</style><g class="alt-motion alt-sway" style="--period:12s;--delay:-0s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M12 117 L58 97 L77 108" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-sway" style="--period:12s;--delay:-2s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M12 134 L58 114 L77 125" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-sway" style="--period:12s;--delay:-4s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M12 151 L58 131 L77 142" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-sway" style="--period:12s;--delay:-6s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M308 57 L262 77 L243 66" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-sway" style="--period:12s;--delay:-8s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M308 74 L262 94 L243 83" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-sway" style="--period:12s;--delay:-10s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M308 91 L262 111 L243 100" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g transform="translate(80.64 44.48) scale(1.24)"><g><path d="M28 44 L28 17 L54 17 L64 27 L111 27 L111 44" fill="none" stroke="var(--ink)" stroke-opacity="0.32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-2s;--low:0.8;--amplitude:1.2px;--origin:64px 48px"><path d="M12 45 L103 45 L91 81 L25 81 L12 45" fill="none" stroke="var(--ink)" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 4.5"/></g><g class="alt-motion alt-breathe" style="--period:6s;--delay:-4s;--low:0.55;--amplitude:1.2px;--origin:64px 48px"><circle cx="35" cy="37" r="1.4" fill="var(--accent)" opacity="1"/><circle cx="40" cy="37" r="1.4" fill="var(--accent)" opacity="1"/><circle cx="45" cy="37" r="1.4" fill="var(--accent)" opacity="1"/></g></g></svg>