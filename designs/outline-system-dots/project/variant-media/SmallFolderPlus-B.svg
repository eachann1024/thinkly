<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 208" width="320" height="208" style="--ink:#1f1e1d;--accent:#547dd0;--danger:#b42318;background:#fafafa" role="img" aria-label="添加本地文件夹 B"><style>
.alt-motion{animation-duration:var(--period,12s);animation-delay:var(--delay,0s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-box:view-box;transform-origin:var(--origin,160px 104px)}
.alt-breathe{animation-name:alt-breathe}.alt-rise{animation-name:alt-rise}.alt-sway{animation-name:alt-sway}.alt-ripple{animation-name:alt-ripple}
@keyframes alt-breathe{0%,100%{opacity:1}50%{opacity:var(--low,.55)}}
@keyframes alt-rise{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:var(--low,.55);transform:translateY(calc(-1 * var(--amplitude,1.2px)))}}
@keyframes alt-sway{0%,100%{opacity:1;transform:translateX(0)}50%{opacity:var(--low,.55);transform:translateX(var(--amplitude,1.2px))}}
@keyframes alt-ripple{0%,100%{opacity:var(--low,.55);transform:scale(.992)}50%{opacity:1;transform:scale(1.008)}}
.variants-paused .alt-motion,[data-offscreen] .alt-motion{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.alt-motion{animation:none!important;transform:none!important;opacity:1!important}}
</style><g class="alt-motion alt-rise" style="--period:12s;--delay:-0s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M18 143 L18 68 L45 68 L57 81 L77 81" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-3s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M30 157 L30 96 L71 96" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-6s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M302 64 L302 140 L273 140 L261 127 L243 127" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g class="alt-motion alt-rise" style="--period:12s;--delay:-9s;--low:0.55;--amplitude:1.2px;--origin:160px 104px"><path d="M290 51 L290 112 L249 112" fill="none" stroke="var(--ink)" stroke-opacity="0.21" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 6.4"/></g><g transform="translate(103.9 47.9) scale(5.1)"><g><path d="M3 9V5H8L10 7H13M2 10H15L12 18H4L2 10" fill="none" stroke="var(--ink)" stroke-opacity="0.78" stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=".01 1.8"/></g><g class="alt-motion alt-breathe" style="--period:6s;--delay:-4s;--low:0.55;--amplitude:1.2px;--origin:11px 11px"><circle cx="18" cy="7" r="0.58" fill="var(--accent)" opacity="1"/><circle cx="15.4" cy="7" r="0.58" fill="var(--accent)" opacity="1"/><circle cx="20.6" cy="7" r="0.58" fill="var(--accent)" opacity="1"/><circle cx="18" cy="4.4" r="0.58" fill="var(--accent)" opacity="1"/><circle cx="18" cy="9.6" r="0.58" fill="var(--accent)" opacity="1"/></g></g></svg>