<helmet><style>
body{margin:0}
.variants-board{box-sizing:border-box;width:1600px;height:480px;padding:28px 32px 32px;background:var(--surface);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.variants-board h1{margin:0;font-size:28px;font-weight:600;line-height:1.4;letter-spacing:-.01em}
.variants-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:18px}
.variants-cell{min-width:0;text-align:center}
.variants-cell h2{font-size:20px;font-weight:400;line-height:28px;margin:0 0 12px}
.variants-cell p{font-size:16px;line-height:24px;color:var(--muted);margin:18px auto 0;max-width:300px}
.variants-stage{width:320px;height:208px;max-width:100%;margin:auto;display:flex;align-items:center;justify-content:center}
.variants-stage>svg{max-width:100%;height:auto}
.variants-native{height:26px;margin:10px auto 0;display:flex;justify-content:center;align-items:center}
.variants-native>svg{width:22px;height:22px}
.variants-cell:first-child{border-right:1px solid var(--border);padding-right:18px}

.alt-motion{animation-duration:var(--period,12s);animation-delay:var(--delay,0s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-box:view-box;transform-origin:var(--origin,160px 104px)}
.alt-breathe{animation-name:alt-breathe}.alt-rise{animation-name:alt-rise}.alt-sway{animation-name:alt-sway}.alt-ripple{animation-name:alt-ripple}
@keyframes alt-breathe{0%,100%{opacity:1}50%{opacity:var(--low,.55)}}
@keyframes alt-rise{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:var(--low,.55);transform:translateY(calc(-1 * var(--amplitude,1.2px)))}}
@keyframes alt-sway{0%,100%{opacity:1;transform:translateX(0)}50%{opacity:var(--low,.55);transform:translateX(var(--amplitude,1.2px))}}
@keyframes alt-ripple{0%,100%{opacity:var(--low,.55);transform:scale(.992)}50%{opacity:1;transform:scale(1.008)}}
.variants-paused .alt-motion,[data-offscreen] .alt-motion{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.alt-motion{animation:none!important;transform:none!important;opacity:1!important}}
.goose-empty-art-ink{fill:currentColor}.goose-empty-art-accent{fill:var(--goose-accent-solid)}.goose-empty-art-danger{fill:var(--goose-color-danger)}.goose-empty-art-soft{opacity:.24}.goose-empty-art-secondary{opacity:.5}.goose-empty-art-body{opacity:.8}</style></helmet>
