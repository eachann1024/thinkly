.th-d{--ink:#f0efec;--ink2:#c3c2b7;--dis:#8f8e88;--canvas:#181818;--menu:#222222;--input:#262624;--muted:#343434;--line:#3c3c3c;--fline:#4a4a4a;--hover:#2c2c2c;--sel:#343434;--accent:#779de8;--d-bg:#481f24;--d-line:#e27d75;--d-fg:#ffb4ab;--link:#8fb0ee;--shadow:0 10px 28px rgba(0,0,0,.42),0 1px 3px rgba(0,0,0,.3);
--sec-bg:#2c2c2c;--ter-bg:#3a3a3a;--pri-bg:#58647b;--f-top:#3b3f47;--f-bot:#31353d;--s-top:#30343b;--s-bot:#2a2d33;--p-top:#737f96;--p-bot:#58647b;--p-ftop:#8995ac;--p-fbot:#68768f;--edge:rgb(10 14 22 / .55);--shine:rgb(255 255 255 / .2);--shade:rgb(0 0 0 / .3);--drop:rgb(0 0 0 / .25);--press:rgb(0 0 0 / .5)}
.th{--p-edge:#1b2332;--p-shine:rgb(255 255 255 / .18);--p-shade:rgb(0 0 0 / .22);--p-drop:rgb(25 34 48 / .19);--p-press:rgb(0 0 0 / .4);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--ink);-webkit-font-smoothing:antialiased}
.th h1{margin:0;font-size:20px;line-height:28px;font-weight:560;letter-spacing:-.01em}
.th h2{margin:0;font-size:15px;line-height:22px;font-weight:560}
.th .cap{font-size:12px;line-height:16px;color:var(--ink2)}
.th .lab{font-size:13px;line-height:20px;color:var(--ink2)}
.th *{box-sizing:border-box}
@keyframes spin{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes pin{ from{opacity:0;transform:translateY(-6px) scale(.96)} to{opacity:1;transform:none} }
@keyframes pout{ from{opacity:1;transform:none} to{opacity:0;transform:translateY(-4px) scale(.98)} }
.spin{animation:spin .9s linear infinite}
@media (prefers-reduced-motion: reduce){ .spin{animation:none} .pop,.pop-out{animation:none!important} .th *{transition:none!important} }


.btn{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border:1px solid transparent;border-radius:8px;font-family:inherit;font-size:14px;font-weight:460;line-height:20px;white-space:nowrap;cursor:pointer;outline:none;color:var(--ink);background:transparent;transition:transform 120ms ease,background-color 150ms ease,border-color 150ms ease,color 150ms ease,box-shadow 150ms ease}
.btn svg{flex-shrink:0}
.sz-c{height:36px;padding:0 12px}
.sz-s{height:28px;padding:0 10px;font-size:13px;gap:6px}
.surf{background-color:var(--bg);border-color:var(--be);color:var(--bf)}
.v-sec{--bg:var(--sec-bg);--be:var(--fline);--bf:var(--ink);--bh:var(--hover);--bfo:var(--hover);--ba:var(--sel)}
.v-ter{--bg:var(--ter-bg);--be:transparent;--bf:var(--ink);--bh:color-mix(in srgb,var(--ter-bg) 90%,var(--ink));--bfo:color-mix(in srgb,var(--ter-bg) 90%,var(--ink));--ba:color-mix(in srgb,var(--ter-bg) 80%,var(--ink))}
.v-pri{--bg:var(--pri-bg);--be:transparent;--bf:#fff;--bh:color-mix(in srgb,var(--pri-bg) 86%,white);--bfo:color-mix(in srgb,var(--pri-bg) 86%,white);--ba:color-mix(in srgb,var(--pri-bg) 85%,black)}
.v-dng{--bg:var(--d-bg);--be:var(--d-line);--bf:var(--d-fg);--bh:color-mix(in srgb,var(--d-bg) 88%,var(--d-line));--bfo:color-mix(in srgb,var(--d-bg) 88%,var(--d-line));--ba:color-mix(in srgb,var(--d-bg) 78%,var(--d-line))}
.surf:is(:hover,.is-hover):not(:disabled):not([aria-busy="true"]){background-color:var(--bh)}
.surf:is(:focus-visible,.is-focus):not(:disabled){background-color:var(--bfo)}
.surf:is(:active,.is-active):not(:disabled):not([aria-busy="true"]){background-color:var(--ba);transform:scale(.98)}
.v-gho{background:transparent;color:var(--ink)}
.v-gho:is(:hover,.is-hover,:focus-visible,.is-focus):not(:disabled):not([aria-busy="true"]){background:var(--hover)}
.v-gho:is(:active,.is-active):not(:disabled):not([aria-busy="true"]){background:var(--sel);transform:scale(.98)}
.v-lnk{background:transparent;color:var(--link);padding:0 4px;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:4px}
.v-lnk:is(:hover,.is-hover,:focus-visible,.is-focus):not(:disabled):not([aria-busy="true"]){color:var(--ink);text-decoration-color:currentColor}
.v-lnk:is(:active,.is-active):not(:disabled):not([aria-busy="true"]){color:var(--ink);text-decoration-color:currentColor;opacity:.72}
.btn.btn:is([aria-pressed="true"],[aria-expanded="true"],.is-sel):not(:disabled){background-color:var(--sel);color:var(--ink);border-color:transparent;box-shadow:inset 0 0 0 1px var(--accent);transform:none}
.btn[aria-busy="true"]{cursor:progress;transform:none}
.btn.btn:disabled,.btn.btn.is-dis{background-color:var(--muted);color:var(--dis);border-color:var(--line);box-shadow:none;transform:none;cursor:not-allowed;opacity:1}
.v-gho:disabled,.v-lnk:disabled{background-color:transparent!important;border-color:transparent!important}
.ibtn{width:32px;height:32px;padding:0;border-radius:10px;gap:0}
.ibtn.ib-c{width:28px;height:28px;border-radius:8px}
.ibtn.ib-s{width:24px;height:24px;border-radius:6px}
.mx{display:grid;grid-template-columns:72px repeat(7,minmax(0,1fr));column-gap:12px;row-gap:14px;align-items:center}
.mx .c{display:flex;justify-content:flex-start}
.row{display:flex;align-items:center;gap:12px}
.grp{display:flex;flex-direction:column;gap:10px}

</style>

<div style="display:flex;flex-direction:column;gap:16px"><h2>实时交互</h2>
<div class="row" style="gap:48px;align-items:flex-start">
<div class="grp"><span class="cap">点击加载并完成</span>
<button type="button" class="btn surf v-pri" aria-busy="{{busy}}" onClick="{{save}}">
<sc-if value="{{busy}}" hint-placeholder-val="{{ false }}"><svg class="spin" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="5.5" stroke-opacity=".25"></circle><path d="M13.5 8A5.5 5.5 0 0 0 8 2.5"></path></svg></sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg></sc-if>
<sc-if value="{{idle}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"></path></svg></sc-if>
<span>{{saveLabel}}</span></button></div>

<div class="grp"><span class="cap">透明图标切换</span>
<button type="button" class="btn v-gho ibtn" aria-pressed="{{star}}" aria-label="收藏" onClick="{{toggleStar}}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg></button></div>
<div class="grp"><span class="cap">危险操作</span>
<button type="button" class="btn surf v-dng" onClick="{{noop}}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.5 8h6l.5-8M7 7v3.5M9 7v3.5"></path></svg>删除</button></div></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1080,"height":860}}'>
class Component extends DCLogic {
state = { busy: false, done: false, pinned: false, star: false };
componentWillUnmount() { clearTimeout(this.t); }
renderVals() {
const s = this.state;
const d = this.props.dark;
const dark = d === true || d === 'true';
return {
themeClass: dark ? 'th-d' : 'th-l',
busy: s.busy, done: s.done && !s.busy, idle: !s.busy && !s.done,
saveLabel: s.busy ? '保存中' : (s.done ? '已保存' : '保存'),
pinned: s.pinned, pinLabel: s.pinned ? '已固定' : '固定', star: s.star,
save: () => {
if (this.state.busy) return;
this.setState({ busy: true, done: false });
this.t = setTimeout(() => this.setState({ busy: false, done: true }), 1400);
},
pin: () => this.setState({ pinned: !this.state.pinned }),
toggleStar: () => this.setState({ star: !this.state.star }),
noop: () => {},
};
}
}
</script>
