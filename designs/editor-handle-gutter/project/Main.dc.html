<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>A 现状：左宽右贴边</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3d63b0}
</style>
</helmet>
<div style="width: 1200px; height: 720px; box-sizing: border-box; display: flex; background: #f1f1f1; font-family: -apple-system, 'PingFang SC', system-ui, sans-serif; color: #20242c; font-size: 14px">
  <div style="width: 52px; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 56px">
    <div style="width: 30px; height: 30px; border-radius: 8px; background: #e5edfc; outline: 1px solid #547dd0"></div>
    <div style="width: 18px; height: 2px; background: #526071"></div>
    <div style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid #526071"></div>
  </div>
  <div style="width: 220px; background: #fafafa; display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; box-sizing: border-box; border-right: 1px solid #e6e6e6">
    <div style="font-weight: 600; padding: 6px 8px">Note</div>
    <div style="padding: 6px 8px">好文归档</div>
    <div style="padding: 6px 8px">IDEA</div>
    <div style="padding: 6px 8px">抖音</div>
    <div style="padding: 6px 8px; border-radius: 6px; background: #e5edfc; outline: 1px solid #547dd0">账号归档</div>
    <div style="padding: 6px 8px">Mac</div>
    <div style="padding: 6px 8px">linux</div>
  </div>
  <div style="flex: 1; position: relative; background: #ffffff; overflow: hidden">
    <div style="height: 40px; display: flex; align-items: center; padding: 0 16px; font-size: 13px; color: #526071">账号归档</div>
    <div style="position: absolute; top: 40px; bottom: 0; left: 0; width: {{padL}}px; background: rgba(217,119,6,0.10)"></div>
    <div style="position: absolute; top: 40px; bottom: 0; right: 0; width: {{padR}}px; background: rgba(217,119,6,0.10)"></div>
    <div style="box-sizing: border-box; padding: 24px {{padR}}px 0 {{padL}}px; display: flex; flex-direction: column; gap: 28px">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #e3e3e3; font-size: 13px">
        <div style="padding: 10px 12px; border-right: 1px solid #e3e3e3; border-bottom: 1px solid #e3e3e3">Vercel</div>
        <div style="padding: 10px 12px; border-right: 1px solid #e3e3e3; border-bottom: 1px solid #e3e3e3">[令牌已隐藏]</div>
        <div style="padding: 10px 12px; border-bottom: 1px solid #e3e3e3">部署平台令牌</div>
        <div style="padding: 10px 12px; border-right: 1px solid #e3e3e3; border-bottom: 1px solid #e3e3e3">figma</div>
        <div style="padding: 10px 12px; border-right: 1px solid #e3e3e3; border-bottom: 1px solid #e3e3e3">[令牌已隐藏]</div>
        <div style="padding: 10px 12px; border-bottom: 1px solid #e3e3e3">—</div>
        <div style="padding: 10px 12px; border-right: 1px solid #e3e3e3">Gitee</div>
        <div style="padding: 10px 12px; border-right: 1px solid #e3e3e3">[令牌已隐藏]</div>
        <div style="padding: 10px 12px">私人令牌 bot 已生成</div>
      </div>
      <div style="position: relative; display: flex; gap: 10px; line-height: 1.7; font-size: 15px">
        <div style="position: absolute; left: {{handleX}}px; top: 2px; display: flex; gap: 2px; padding: 2px 4px; border: 1px solid #e3e3e3; border-radius: 6px; background: #ffffff">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#526071" stroke-width="1.4" aria-hidden="true"><path d="M2 3.5h10M2 7h10M2 10.5h10"></path></svg>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="#526071" aria-hidden="true"><circle cx="5" cy="3" r="1.1"></circle><circle cx="9" cy="3" r="1.1"></circle><circle cx="5" cy="7" r="1.1"></circle><circle cx="9" cy="7" r="1.1"></circle><circle cx="5" cy="11" r="1.1"></circle><circle cx="9" cy="11" r="1.1"></circle></svg>
        </div>
        <span>•</span>
        <span>SEAGM（账号 each1026）：2026-10-28 已绑定手机；已于 2026-10-28 提交发票申请（状态待发货）。</span>
      </div>
    </div>
    <div style="position: absolute; left: 0; bottom: 20px; width: {{padL}}px; text-align: center; font-size: 12px; font-weight: 600; color: #8a4b00">{{padL}}px</div>
    <div style="position: absolute; right: 0; bottom: 20px; width: 64px; text-align: right; padding-right: 6px; box-sizing: border-box; font-size: 12px; font-weight: 600; color: #8a4b00">{{padR}}px</div>
  </div>
  <div style="width: 320px; background: #ffffff; border-left: 1px solid #e6e6e6; display: flex; flex-direction: column">
    <div style="height: 40px; display: flex; align-items: center; padding: 0 16px; font-size: 13px; font-weight: 600">AI 助手</div>
    <div style="flex: 1"></div>
    <div style="margin: 16px; border: 1px solid #e3e3e3; border-radius: 10px; padding: 14px; color: #526071; font-size: 13px; height: 96px; box-sizing: border-box">让 AI 根据当前笔记生成…</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"padL":{"editor":"int","default":104},"padR":{"editor":"int","default":8},"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const padL = this.props.padL ?? 104;
const padR = this.props.padR ?? 8;
return { padL, padR, handleX: -(padL - 44) };
}
}
</script>
</body>
</html>
