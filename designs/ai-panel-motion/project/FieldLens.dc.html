<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>C2 透镜 · 空闲</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#779de8}a:hover{color:#9db8ef}
@keyframes wave{0%,100%{opacity:.45}12%{opacity:1}30%{opacity:.45}}
@keyframes glint{0%,100%{opacity:.55}8%{opacity:1}20%{opacity:.55}}
@keyframes breathe{0%,100%{transform:scale(.98)}50%{transform:scale(1.02)}}
@keyframes ripple{0%{transform:scale(.45);opacity:0}25%{opacity:.8}100%{transform:scale(1.25);opacity:0}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(420px)}}
.c2-ring{position:absolute;inset:0;animation:wave 6s ease-in-out infinite}
.c2-dot{position:absolute;border-radius:50%;background:#8a8a8a}
.c2-lens{position:absolute;inset:0;transform-origin:210px 260px;animation:breathe 9s ease-in-out infinite;will-change:transform}
.c2-band{position:absolute;inset:0;animation:glint 4.5s ease-in-out infinite}
.c2-sd{position:absolute;border-radius:50%;background:#779de8}
.c2-rip{position:absolute;left:60px;top:110px;width:300px;height:300px;border-radius:50%;border:1px solid rgba(119,157,232,.45);animation:ripple 6s cubic-bezier(.22,.61,.36,1) infinite;will-change:transform,opacity}
.c2-key{font:inherit;display:flex;align-items:center;gap:10px;height:36px;padding:0 12px 0 6px;border-radius:10px;border:1px solid #2c2c2c;background:#1b1b1b;color:#ececec;font-size:13px;cursor:pointer;transition:border-color .15s,transform .15s;animation:rise .5s cubic-bezier(.22,.61,.36,1) both}
.c2-key:hover{border-color:#779de8;transform:translateY(-1px)}
.c2-num{width:22px;height:22px;border-radius:6px;background:#262626;color:#8f8e88;font:500 11px/22px 'JetBrains Mono',ui-monospace,Menlo,monospace;text-align:center}
.c2-icon{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#b4b4b4;cursor:pointer}
.c2-icon:hover{background:#2c2c2c;color:#ececec}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="position:relative;width:420px;height:780px;box-sizing:border-box;background:#181818;font-family:Inter,-apple-system,'PingFang SC',system-ui,sans-serif;color:#ececec;display:flex;flex-direction:column;overflow:hidden">

<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none">
<span class="c2-rip"></span>
<span class="c2-rip" style="animation-delay:-3s"></span>
<sc-for list="{{field}}" as="ring" hint-placeholder-count="8">
<div class="c2-ring" style="{{ring.style}}">
<sc-for list="{{ring.dots}}" as="d" hint-placeholder-count="8"><span class="c2-dot" style="{{d.style}}"></span></sc-for>
</div>
</sc-for>
<div class="c2-lens">
<sc-for list="{{glint}}" as="band" hint-placeholder-count="8">
<div class="c2-band" style="{{band.style}}">
<sc-for list="{{band.dots}}" as="d" hint-placeholder-count="6"><span class="c2-sd" style="{{d.style}}"></span></sc-for>
</div>
</sc-for>
</div>
</div>

<div style="position:relative;height:44px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px;background:#181818">
<span style="font-size:13px;font-weight:500">AI 助手</span>
<span style="margin-left:auto"></span>
<button class="c2-icon" aria-label="新对话"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="c2-icon" aria-label="历史"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
<button class="c2-icon" aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div style="position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:396px 24px 0">
<div style="font-size:20px;font-weight:560;line-height:28px;letter-spacing:-.01em;padding:0 10px;background:#181818;border-radius:8px">想怎么修改这篇笔记？</div>
<div style="display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:#8f8e88;padding:0 8px;background:#181818;border-radius:6px"><span style="width:6px;height:6px;border-radius:50%;background:#779de8"></span>已读取 Mac · 2 段代码</div>
</div>

<div style="position:relative;flex:none;display:flex;flex-direction:column;gap:10px;padding:0 16px 16px">
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="c2-key" style="animation-delay:.05s"><span class="c2-num">1</span>润色</button>
<button class="c2-key" style="animation-delay:.1s"><span class="c2-num">2</span>整理成清单</button>
<button class="c2-key" style="animation-delay:.15s"><span class="c2-num">3</span>提炼要点</button>
</div>
<div style="position:relative;overflow:hidden;border-radius:12px;border:1px solid #333333;background:#1d1d1d">
<div style="display:flex;align-items:center;gap:4px;height:44px;padding:0 6px">
<button class="c2-icon" aria-label="添加附件"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<label style="flex:1;min-width:0;display:flex;align-items:center;gap:2px;font-size:14px;line-height:20px;color:#8f8e88;white-space:nowrap;overflow:hidden"><span style="width:2px;height:18px;background:#779de8;animation:caret 1.1s steps(1) infinite"></span>问 AI…</label>
<span style="font:500 11px/16px 'JetBrains Mono',ui-monospace,Menlo,monospace;color:#8f8e88;padding:0 4px">Flash</span>
<button aria-label="发送" style="width:32px;height:32px;border:0;border-radius:8px;background:#2c2c2c;color:#ececec;display:grid;place-items:center;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
</div>
<div aria-hidden="true" style="position:absolute;left:0;bottom:0;width:96px;height:1px;background:linear-gradient(90deg,transparent,#779de8,transparent);animation:scan 4s linear infinite"></div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":780}}'>
class Component extends DCLogic {
renderVals() {
const cx = 210, cy = 260, step = 16, R = 84, L = 115;
const field = [], glint = [];
for (let k = 0; k < 8; k++) field.push({ style: 'animation-delay:' + (k * 0.35).toFixed(2) + 's', dots: [] });
for (let k = 0; k < 8; k++) glint.push({ style: 'animation-delay:' + (k * 0.16).toFixed(2) + 's', dots: [] });
for (let gy = 4; gy < 780; gy += step) {
for (let gx = 2; gx < 420; gx += step) {
const dx = gx - cx, dy = gy - cy, d = Math.hypot(dx, dy);
const lens = Math.exp(-Math.pow(d / L, 2));
const x = cx + dx * (1 + 0.32 * lens), y = cy + dy * (1 + 0.32 * lens);
const v = Math.sqrt(Math.abs(dx) / R) + Math.sqrt(Math.abs(dy) / R);
if (v <= 1) {
const s = 2.4 + 3.4 * lens;
const band = Math.min(7, Math.max(0, Math.floor((dx + dy + 2 * R) / (4 * R) * 8)));
const tint = v < 0.32 ? ';background:#c9d8f7' : '';
glint[band].dots.push({ style: 'left:' + (x - s / 2).toFixed(1) + 'px;top:' + (y - s / 2).toFixed(1) + 'px;width:' + s.toFixed(1) + 'px;height:' + s.toFixed(1) + 'px;opacity:' + (1 - v * 0.45).toFixed(2) + tint });
} else {
const s = 1.6 + 2.2 * lens;
const op = 0.28 + 0.5 * lens;
const k = Math.min(7, Math.floor(d / 48));
field[k].dots.push({ style: 'left:' + (x - s / 2).toFixed(1) + 'px;top:' + (y - s / 2).toFixed(1) + 'px;width:' + s.toFixed(1) + 'px;height:' + s.toFixed(1) + 'px;opacity:' + op.toFixed(2) });
}
}
}
return { field, glint };
}
}
</script>
</body>
</html>
