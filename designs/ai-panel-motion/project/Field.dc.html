<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>C 点场 · 空闲</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#779de8}a:hover{color:#9db8ef}
@keyframes wave{0%,100%{opacity:.18;transform:scale(1)}12%{opacity:1;transform:scale(1.04)}30%{opacity:.18;transform:scale(1)}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(420px)}}
.cf-ring{position:absolute;inset:0;animation:wave 5s ease-in-out infinite;will-change:opacity,transform;transform-origin:210px 300px}
.cf-dot{position:absolute;width:3px;height:3px;border-radius:50%;background:#8a8a8a}
.cf-key{font:inherit;display:flex;align-items:center;gap:10px;height:36px;padding:0 12px 0 6px;border-radius:10px;border:1px solid #2c2c2c;background:rgba(24,24,24,.9);color:#ececec;font-size:13px;cursor:pointer;transition:border-color .15s,transform .15s;animation:rise .5s cubic-bezier(.22,.61,.36,1) both}
.cf-key:hover{border-color:#779de8;transform:translateY(-1px)}
.cf-num{width:22px;height:22px;border-radius:6px;background:#262626;color:#8f8e88;font:500 11px/22px 'JetBrains Mono',ui-monospace,Menlo,monospace;text-align:center}
.cf-icon{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#b4b4b4;cursor:pointer}
.cf-icon:hover{background:#2c2c2c;color:#ececec}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="position:relative;width:420px;height:780px;box-sizing:border-box;background:#181818;font-family:Inter,-apple-system,'PingFang SC',system-ui,sans-serif;color:#ececec;display:flex;flex-direction:column;overflow:hidden">

<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none">
<sc-for list="{{rings}}" as="ring" hint-placeholder-count="8">
<div class="cf-ring" style="{{ring.style}}">
<sc-for list="{{ring.dots}}" as="d" hint-placeholder-count="8">
<span class="cf-dot" style="{{d.style}}"></span>
</sc-for>
</div>
</sc-for>
</div>

<div style="position:relative;height:44px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px">
<span style="font-size:13px;font-weight:500">AI 助手</span>
<span style="margin-left:auto"></span>
<button class="cf-icon" aria-label="新对话"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="cf-icon" aria-label="历史"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
<button class="cf-icon" aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div style="position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px">
<div style="width:12px;height:12px;border-radius:50%;background:#779de8;box-shadow:0 0 0 6px rgba(119,157,232,.14)"></div>
<div style="font-size:15px;font-weight:560;line-height:22px;padding:4px 10px;background:#181818;border-radius:8px">想怎么修改这篇笔记？</div>
</div>

<div style="position:relative;flex:none;display:flex;flex-direction:column;gap:10px;padding:0 16px 16px">
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="cf-key" style="animation-delay:.05s"><span class="cf-num">1</span>润色</button>
<button class="cf-key" style="animation-delay:.1s"><span class="cf-num">2</span>整理成清单</button>
<button class="cf-key" style="animation-delay:.15s"><span class="cf-num">3</span>提炼要点</button>
</div>
<div style="position:relative;overflow:hidden;border-radius:12px;border:1px solid #333333;background:#1d1d1d">
<div style="display:flex;align-items:center;gap:4px;height:44px;padding:0 6px">
<button class="cf-icon" aria-label="添加附件"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<label style="flex:1;min-width:0;display:flex;align-items:center;gap:2px;font-size:14px;line-height:20px;color:#8f8e88;white-space:nowrap;overflow:hidden"><span style="width:2px;height:18px;background:#779de8;animation:caret 1.1s steps(1) infinite"></span>问 AI…</label>
<span style="font:500 11px/16px 'JetBrains Mono',ui-monospace,Menlo,monospace;color:#8f8e88;padding:0 4px">Flash</span>
<button aria-label="发送" style="width:32px;height:32px;border:0;border-radius:8px;background:#2c2c2c;color:#ececec;display:grid;place-items:center;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
</div>
<div aria-hidden="true" style="position:absolute;left:0;bottom:0;width:96px;height:1px;background:linear-gradient(90deg,transparent,#779de8,transparent);animation:scan 4s linear infinite"></div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":780}}'>
class Component extends DCLogic {
renderVals() {
const cx = 210, cy = 300, step = 20, rings = [];
for (let r = 0; r < 9; r++) rings.push({ style: 'animation-delay:' + (r * 0.22).toFixed(2) + 's', dots: [] });
for (let y = 10; y < 780; y += step) {
for (let x = 10; x < 420; x += step) {
const d = Math.hypot(x - cx, y - cy);
const r = Math.floor(d / 40);
if (r < 9) rings[r].dots.push({ style: 'left:' + (x - 1.5) + 'px;top:' + (y - 1.5) + 'px' });
}
}
return { rings };
}
}
</script>
</body>
</html>
