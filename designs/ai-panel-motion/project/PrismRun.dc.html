<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>B 棱光 · 生成中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#779de8}a:hover{color:#9db8ef}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes inX{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes ticker{0%,20%{transform:translateY(0)}25%,45%{transform:translateY(-20px)}50%,70%{transform:translateY(-40px)}75%,95%{transform:translateY(-60px)}100%{transform:translateY(-80px)}}
@keyframes fadeTail{0%{opacity:.25}100%{opacity:1}}
.pr-av{position:relative;width:24px;height:24px;border-radius:50%;overflow:hidden;background:#181818;flex:none}
.pr-av span{position:absolute;width:16px;height:16px;border-radius:50%;filter:blur(4px)}
.pr-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:#222222;border:1px solid #2e2e2e;font-size:12px;color:#c3c2b7;animation:inX .45s cubic-bezier(.22,.61,.36,1) both}
.pr-p{animation:rise .5s cubic-bezier(.22,.61,.36,1) both}
.pr-tail{animation:fadeTail .6s ease-out infinite alternate}
.pr-beam{position:absolute;left:0;right:0;bottom:0;height:2px;overflow:hidden}
.pr-beam span{position:absolute;inset:0;background:linear-gradient(90deg,transparent,#779de8 35%,#c7a6f0 55%,#4fb3c9 70%,transparent);animation:slide 1.1s ease-in-out infinite alternate}
.pr-icon{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#b4b4b4;cursor:pointer}
.pr-icon:hover{background:#2c2c2c;color:#ececec}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width:420px;height:780px;box-sizing:border-box;background:#181818;font-family:Inter,-apple-system,'PingFang SC',system-ui,sans-serif;color:#ececec;display:flex;flex-direction:column">

<div style="height:44px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px">
<span style="font-size:13px;font-weight:500">AI 助手</span>
<span style="margin-left:auto"></span>
<button class="pr-icon" aria-label="新对话"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="pr-icon" aria-label="历史"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
<button class="pr-icon" aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:20px;padding:16px">
<div style="align-self:flex-end;max-width:80%;background:#242424;border-radius:16px;padding:8px 14px;font-size:14px;line-height:20px">把这两条命令解释清楚，整理成清单</div>

<div style="display:flex;gap:12px">
<div class="pr-av" aria-hidden="true">
<div style="position:absolute;inset:0;animation:orbit 1.6s linear infinite">
<span style="left:-2px;top:-2px;background:#5b86e0"></span>
<span style="right:-2px;top:6px;background:#a685e8"></span>
<span style="left:4px;bottom:-4px;background:#4fb3c9"></span>
</div>
</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:8px;height:24px;font-size:13px;color:#b4b4b4">
<span style="height:20px;overflow:hidden;line-height:20px"><span style="display:flex;flex-direction:column;animation:ticker 8s cubic-bezier(.65,0,.35,1) infinite"><span>读取笔记</span><span>理解代码</span><span>组织结构</span><span>写清单</span><span>读取笔记</span></span></span>
<span style="margin-left:auto;font-variant-numeric:tabular-nums;color:#8f8e88">6.2 秒</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:6px">
<span class="pr-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/></svg>Mac</span>
<span class="pr-chip" style="animation-delay:.15s"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/></svg>2 段代码</span>
</div>
<div style="display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:22px">
<div class="pr-p">两条命令各管一件事：</div>
<div class="pr-p" style="animation-delay:.2s;background:#1f1f1f;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px">
<div style="font-weight:560">锁定输入法</div>
<div style="color:#c3c2b7">先禁止修改 <code style="font:12px/20px 'JetBrains Mono',ui-monospace,Menlo,monospace;color:#9db8ef">HIToolbox.plist</code>，系统就不会再改回默认输入法。</div>
</div>
<div class="pr-p" style="animation-delay:.4s;background:#1f1f1f;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px">
<div style="font-weight:560">放行开源软件</div>
<div style="color:#c3c2b7"><code style="font:12px/20px 'JetBrains Mono',ui-monospace,Menlo,monospace;color:#9db8ef">xattr -rd</code> 清除隔离标记，<span class="pr-tail">打开时不再提示已损坏</span></div>
</div>
</div>
</div>
</div>
</div>

<div style="flex:none;padding:0 16px 16px">
<div style="position:relative;overflow:hidden;border-radius:22px;background:#222222;border:1px solid #333333">
<div style="display:flex;align-items:center;gap:2px;height:44px;padding:0 6px 0 4px">
<button class="pr-icon" aria-label="添加附件"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<label style="flex:1;min-width:0;font-size:14px;line-height:20px;color:#8f8e88;white-space:nowrap;overflow:hidden">继续追问…</label>
<button style="font:inherit;font-size:12px;color:#b4b4b4;background:#2a2a2a;border:0;border-radius:999px;height:28px;padding:0 10px;display:flex;align-items:center;gap:6px;cursor:pointer"><span style="width:6px;height:6px;border-radius:50%;background:#4fb3c9"></span>Flash</button>
<button aria-label="停止生成" style="width:32px;height:32px;margin-left:4px;border:0;border-radius:50%;background:#ececec;display:grid;place-items:center;cursor:pointer"><span style="width:10px;height:10px;border-radius:2px;background:#181818"></span></button>
</div>
<div class="pr-beam" aria-hidden="true"><span></span></div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":780}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
