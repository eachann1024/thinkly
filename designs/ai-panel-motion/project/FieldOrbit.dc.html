<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>C1 星轨 · 空闲</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#779de8}a:hover{color:#9db8ef}
@keyframes wave{0%,100%{opacity:.35}12%{opacity:1}30%{opacity:.35}}
@keyframes breathe{0%,100%{transform:scale(.97)}50%{transform:scale(1.03)}}
@keyframes trail{0%{opacity:1;transform:scale(2.2)}6%{opacity:.95;transform:scale(1.6)}22%,100%{opacity:.3;transform:scale(1)}}
@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(420px)}}
.c1-ring{position:absolute;inset:0;animation:wave 6s ease-in-out infinite}
.c1-dot{position:absolute;width:2px;height:2px;border-radius:50%;background:#8a8a8a}
.c1-star{position:absolute;inset:0;transform-origin:210px 270px;animation:breathe 8s ease-in-out infinite;will-change:transform}
.c1-sd{position:absolute;border-radius:50%;background:#779de8}
.c1-core{position:absolute;inset:0;animation:twinkle 3.2s ease-in-out infinite}
.c1-o{position:absolute;width:3px;height:3px}
.c1-o i{display:block;width:3px;height:3px;border-radius:50%;background:#779de8;animation:trail linear infinite;will-change:transform,opacity}
.c1-key{font:inherit;display:flex;align-items:center;gap:10px;height:36px;padding:0 12px 0 6px;border-radius:10px;border:1px solid #2c2c2c;background:#1b1b1b;color:#ececec;font-size:13px;cursor:pointer;transition:border-color .15s,transform .15s;animation:rise .5s cubic-bezier(.22,.61,.36,1) both}
.c1-key:hover{border-color:#779de8;transform:translateY(-1px)}
.c1-num{width:22px;height:22px;border-radius:6px;background:#262626;color:#8f8e88;font:500 11px/22px 'JetBrains Mono',ui-monospace,Menlo,monospace;text-align:center}
.c1-icon{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#b4b4b4;cursor:pointer}
.c1-icon:hover{background:#2c2c2c;color:#ececec}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="position:relative;width:420px;height:780px;box-sizing:border-box;background:#181818;font-family:Inter,-apple-system,'PingFang SC',system-ui,sans-serif;color:#ececec;display:flex;flex-direction:column;overflow:hidden">

<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none">
<sc-for list="{{rings}}" as="ring" hint-placeholder-count="8">
<div class="c1-ring" style="{{ring.style}}">
<sc-for list="{{ring.dots}}" as="d" hint-placeholder-count="8"><span class="c1-dot" style="{{d.style}}"></span></sc-for>
</div>
</sc-for>
<sc-for list="{{orbits}}" as="o" hint-placeholder-count="3">
<div style="position:absolute;inset:0">
<sc-for list="{{o.dots}}" as="d" hint-placeholder-count="40"><span class="c1-o" style="{{d.style}}"><i style="{{d.inner}}"></i></span></sc-for>
</div>
</sc-for>
<div class="c1-star">
<sc-for list="{{star}}" as="d" hint-placeholder-count="60"><span class="c1-sd" style="{{d.style}}"></span></sc-for>
<div class="c1-core">
<sc-for list="{{core}}" as="d" hint-placeholder-count="9"><span class="c1-sd" style="{{d.style}}"></span></sc-for>
</div>
</div>
</div>

<div style="position:relative;height:44px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px">
<span style="font-size:13px;font-weight:500">AI 助手</span>
<span style="margin-left:auto"></span>
<button class="c1-icon" aria-label="新对话"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="c1-icon" aria-label="历史"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
<button class="c1-icon" aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div style="position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:400px 24px 0">
<div style="font-size:20px;font-weight:560;line-height:28px;letter-spacing:-.01em;padding:0 10px;background:#181818;border-radius:8px">想怎么修改这篇笔记？</div>
<div style="display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:#8f8e88;padding:0 8px;background:#181818;border-radius:6px"><span style="width:6px;height:6px;border-radius:50%;background:#779de8"></span>已读取 Mac · 2 段代码</div>
</div>

<div style="position:relative;flex:none;display:flex;flex-direction:column;gap:10px;padding:0 16px 16px">
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="c1-key" style="animation-delay:.05s"><span class="c1-num">1</span>润色</button>
<button class="c1-key" style="animation-delay:.1s"><span class="c1-num">2</span>整理成清单</button>
<button class="c1-key" style="animation-delay:.15s"><span class="c1-num">3</span>提炼要点</button>
</div>
<div style="position:relative;overflow:hidden;border-radius:12px;border:1px solid #333333;background:#1d1d1d">
<div style="display:flex;align-items:center;gap:4px;height:44px;padding:0 6px">
<button class="c1-icon" aria-label="添加附件"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<label style="flex:1;min-width:0;display:flex;align-items:center;gap:2px;font-size:14px;line-height:20px;color:#8f8e88;white-space:nowrap;overflow:hidden"><span style="width:2px;height:18px;background:#779de8;animation:caret 1.1s steps(1) infinite"></span>问 AI…</label>
<span style="font:500 11px/16px 'JetBrains Mono',ui-monospace,Menlo,monospace;color:#8f8e88;padding:0 4px">Flash</span>
<button aria-label="发送" style="width:32px;height:32px;border:0;border-radius:8px;background:#2c2c2c;color:#ececec;display:grid;place-items:center;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
</div>
<div aria-hidden="true" style="position:absolute;left:0;bottom:0;width:96px;height:1px;background:linear-gradient(90deg,transparent,#779de8,transparent);animation:scan 4s linear infinite"></div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":780}}'>
class Component extends DCLogic {
renderVals() {
const cx = 210, cy = 270;
const rings = [];
for (let r = 0; r < 8; r++) rings.push({ style: 'animation-delay:' + (r * 0.35).toFixed(2) + 's', dots: [] });
for (let y = 10; y < 780; y += 20) {
for (let x = 10; x < 420; x += 20) {
const d = Math.hypot(x - cx, y - cy);
if (d < 170) continue;
const r = Math.min(7, Math.floor((d - 170) / 45));
const op = Math.max(0.3, 1 - (d - 170) / 520);
rings[r].dots.push({ style: 'left:' + (x - 1) + 'px;top:' + (y - 1) + 'px;opacity:' + op.toFixed(2) });
}
}
const star = [], core = [], R = 44;
for (let y = -R; y <= R; y += 5) {
for (let x = -R; x <= R; x += 5) {
const v = Math.sqrt(Math.abs(x) / R) + Math.sqrt(Math.abs(y) / R);
if (v > 1) continue;
const s = v < 0.3 ? 4 : v < 0.65 ? 3 : 2;
const item = { style: 'left:' + (cx + x - s / 2) + 'px;top:' + (cy + y - s / 2) + 'px;width:' + s + 'px;height:' + s + 'px;opacity:' + (1 - v * 0.6).toFixed(2) + (v < 0.3 ? ';background:#c9d8f7' : '') };
(v < 0.3 ? core : star).push(item);
}
}
const specs = [{ a: 92, t: -18, n: 48, dur: 5 }, { a: 122, t: 30, n: 60, dur: 7.5 }, { a: 150, t: -64, n: 72, dur: 10 }];
const orbits = specs.map((o) => {
const b = o.a * 0.34, rad = o.t * Math.PI / 180, dots = [];
for (let i = 0; i < o.n; i++) {
const th = i / o.n * Math.PI * 2;
const ex = o.a * Math.cos(th), ey = b * Math.sin(th);
const x = cx + ex * Math.cos(rad) - ey * Math.sin(rad);
const y = cy + ex * Math.sin(rad) + ey * Math.cos(rad);
const front = Math.sin(th) > 0;
dots.push({
style: 'left:' + (x - 1.5).toFixed(1) + 'px;top:' + (y - 1.5).toFixed(1) + 'px;opacity:' + (front ? 0.95 : 0.4),
inner: 'animation-duration:' + o.dur + 's;animation-delay:-' + (o.dur * (1 - i / o.n)).toFixed(2) + 's'
});
}
return { dots };
});
return { rings, star, core, orbits };
}
}
</script>
</body>
</html>
