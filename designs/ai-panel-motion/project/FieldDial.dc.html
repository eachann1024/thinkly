<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>C3 罗盘 · 空闲</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#779de8}a:hover{color:#9db8ef}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%,100%{opacity:.35}12%{opacity:.9}30%{opacity:.35}}
@keyframes breathe{0%,100%{transform:scale(.97)}50%{transform:scale(1.03)}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(420px)}}
.c3-bg{position:absolute;inset:0;animation:wave 7s ease-in-out infinite}
.c3-dot{position:absolute;width:2px;height:2px;border-radius:50%;background:#8a8a8a}
.c3-ring{position:absolute;inset:0;transform-origin:210px 270px;animation:spin linear infinite;will-change:transform}
.c3-rd{position:absolute;border-radius:50%}
.c3-ticks{position:absolute;inset:0;transform-origin:210px 270px;animation:spin 120s linear infinite reverse;will-change:transform}
.c3-tick{position:absolute;width:1px;background:#4a4a4a;transform-origin:50% 0}
.c3-key{font:inherit;display:flex;align-items:center;gap:10px;height:36px;padding:0 12px 0 6px;border-radius:10px;border:1px solid #2c2c2c;background:#1b1b1b;color:#ececec;font-size:13px;cursor:pointer;transition:border-color .15s,transform .15s;animation:rise .5s cubic-bezier(.22,.61,.36,1) both}
.c3-key:hover{border-color:#779de8;transform:translateY(-1px)}
.c3-num{width:22px;height:22px;border-radius:6px;background:#262626;color:#8f8e88;font:500 11px/22px 'JetBrains Mono',ui-monospace,Menlo,monospace;text-align:center}
.c3-icon{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#b4b4b4;cursor:pointer}
.c3-icon:hover{background:#2c2c2c;color:#ececec}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="position:relative;width:420px;height:780px;box-sizing:border-box;background:#181818;font-family:Inter,-apple-system,'PingFang SC',system-ui,sans-serif;color:#ececec;display:flex;flex-direction:column;overflow:hidden">

<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none">
<sc-for list="{{bg}}" as="g" hint-placeholder-count="6">
<div class="c3-bg" style="{{g.style}}">
<sc-for list="{{g.dots}}" as="d" hint-placeholder-count="8"><span class="c3-dot" style="{{d.style}}"></span></sc-for>
</div>
</sc-for>
<div class="c3-ticks">
<sc-for list="{{ticks}}" as="t" hint-placeholder-count="72"><span class="c3-tick" style="{{t.style}}"></span></sc-for>
</div>
<sc-for list="{{rings}}" as="ring" hint-placeholder-count="6">
<div class="c3-ring" style="{{ring.style}}">
<sc-for list="{{ring.dots}}" as="d" hint-placeholder-count="20"><span class="c3-rd" style="{{d.style}}"></span></sc-for>
</div>
</sc-for>
<div style="position:absolute;left:186px;top:246px;width:48px;height:48px;border-radius:14px;background:#1f1f1f;border:1px solid #333333;box-sizing:border-box;display:grid;place-items:center;animation:breathe 8s ease-in-out infinite">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#779de8"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z" opacity=".6"/></svg>
</div>
</div>

<div style="position:relative;height:44px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px">
<span style="font-size:13px;font-weight:500">AI 助手</span>
<span style="margin-left:auto"></span>
<button class="c3-icon" aria-label="新对话"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="c3-icon" aria-label="历史"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
<button class="c3-icon" aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div style="position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:396px 24px 0">
<div style="font-size:20px;font-weight:560;line-height:28px;letter-spacing:-.01em;padding:0 10px;background:#181818;border-radius:8px">想怎么修改这篇笔记？</div>
<div style="display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:#8f8e88;padding:0 8px;background:#181818;border-radius:6px"><span style="width:6px;height:6px;border-radius:50%;background:#779de8"></span>已读取 Mac · 2 段代码</div>
</div>

<div style="position:relative;flex:none;display:flex;flex-direction:column;gap:10px;padding:0 16px 16px">
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="c3-key" style="animation-delay:.05s"><span class="c3-num">1</span>润色</button>
<button class="c3-key" style="animation-delay:.1s"><span class="c3-num">2</span>整理成清单</button>
<button class="c3-key" style="animation-delay:.15s"><span class="c3-num">3</span>提炼要点</button>
</div>
<div style="position:relative;overflow:hidden;border-radius:12px;border:1px solid #333333;background:#1d1d1d">
<div style="display:flex;align-items:center;gap:4px;height:44px;padding:0 6px">
<button class="c3-icon" aria-label="添加附件"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<label style="flex:1;min-width:0;display:flex;align-items:center;gap:2px;font-size:14px;line-height:20px;color:#8f8e88;white-space:nowrap;overflow:hidden"><span style="width:2px;height:18px;background:#779de8;animation:caret 1.1s steps(1) infinite"></span>问 AI…</label>
<span style="font:500 11px/16px 'JetBrains Mono',ui-monospace,Menlo,monospace;color:#8f8e88;padding:0 4px">Flash</span>
<button aria-label="发送" style="width:32px;height:32px;border:0;border-radius:8px;background:#2c2c2c;color:#ececec;display:grid;place-items:center;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
</div>
<div aria-hidden="true" style="position:absolute;left:0;bottom:0;width:96px;height:1px;background:linear-gradient(90deg,transparent,#779de8,transparent);animation:scan 4s linear infinite"></div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":780}}'>
class Component extends DCLogic {
renderVals() {
const cx = 210, cy = 270;
const bg = [];
for (let k = 0; k < 6; k++) bg.push({ style: 'animation-delay:' + (k * 0.4).toFixed(2) + 's', dots: [] });
for (let y = 10; y < 780; y += 20) {
for (let x = 10; x < 420; x += 20) {
const d = Math.hypot(x - cx, y - cy);
if (d < 160) continue;
bg[Math.min(5, Math.floor((d - 160) / 60))].dots.push({ style: 'left:' + (x - 1) + 'px;top:' + (y - 1) + 'px;opacity:' + Math.max(0.3, 1 - (d - 160) / 480).toFixed(2) });
}
}
const ticks = [];
for (let i = 0; i < 72; i++) {
const long = i % 6 === 0, r = 142;
const h = long ? 9 : 4;
ticks.push({ style: 'left:' + (cx - 0.5) + 'px;top:' + (cy - r) + 'px;height:' + h + 'px;transform-origin:0.5px ' + r + 'px;transform:rotate(' + (i * 5) + 'deg)' + (long ? ';background:#6b6b6b' : '') });
}
const durs = [14, 22, 30, 40, 52, 66], arcs = [80, 110, 70, 130, 90, 60];
const rings = [];
for (let i = 0; i < 6; i++) {
const r = 36 + i * 16, n = Math.round(2 * Math.PI * r / 8), off = i * 57, dots = [];
for (let j = 0; j < n; j++) {
const deg = j / n * 360, a = deg * Math.PI / 180;
const into = ((deg - off) % 360 + 360) % 360;
const lit = into < arcs[i];
const s = lit ? 3 : 2;
const op = lit ? (0.35 + 0.65 * into / arcs[i]) : 0.22;
const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
dots.push({ style: 'left:' + (x - s / 2).toFixed(1) + 'px;top:' + (y - s / 2).toFixed(1) + 'px;width:' + s + 'px;height:' + s + 'px;opacity:' + op.toFixed(2) + ';background:' + (lit ? (into > arcs[i] - 8 ? '#c9d8f7' : '#779de8') : '#8a8a8a') });
}
rings.push({ style: 'animation-duration:' + durs[i] + 's' + (i % 2 ? ';animation-direction:reverse' : ''), dots });
}
return { bg, ticks, rings };
}
}
</script>
</body>
</html>
