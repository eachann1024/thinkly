<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>恢复稿</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3f66b8}
.ib{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;color:#526071;cursor:pointer;transition:background-color .15s,color .15s}
.ib:hover{background:#e6e6e6;color:#20242c}
.wc{width:46px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:#20242c;cursor:pointer;transition:background-color .15s,color .15s}
.wc:hover{background:#e4e4e4}.wc.x:hover{background:#c42b1c;color:#ffffff}
.btn{font:inherit;font-size:13px;font-weight:460;height:30px;padding:0 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background-color .15s,transform .12s}
.btn:active{transform:scale(.98)}
.btn-2{background:#ffffff;color:#20242c;border:1px solid #dcdcdc}.btn-2:hover{background:#f7f7f7}
.btn-1{background:#2f3540;color:#ffffff;border:0}.btn-1:hover{background:#3b4250}
.item{font:inherit;width:100%;display:flex;flex-direction:column;gap:3px;padding:10px 10px;border:0;border-radius:8px;background:transparent;color:#20242c;text-align:left;cursor:pointer;transition:background-color .15s}
.item:hover{background:#eef3fc}
@keyframes toast{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:960px;height:680px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c;overflow:hidden;position:relative">
<header style="height:44px;flex:none;display:flex;align-items:center;gap:10px;padding-left:16px">
<sc-if value="{{mac}}" hint-placeholder-val="{{true}}"><div aria-hidden="true" style="display:flex;gap:8px;width:60px"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span></div></sc-if>
<span style="font-size:14px;font-weight:560">恢复稿</span>
<span class="goose-tabular" style="font-size:13px;color:#526071">{{count}}</span>
<span style="flex:1"></span>
<button class="ib" aria-label="刷新列表" title="刷新列表"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
<sc-if value="{{mac}}" hint-placeholder-val="{{true}}"><span style="width:6px"></span></sc-if>
<sc-if value="{{win}}" hint-placeholder-val="{{false}}"><div style="display:flex;margin-left:6px"><button class="wc" aria-label="最小化"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor"/></svg></button><button class="wc" aria-label="最大化"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9" stroke="currentColor"/></svg></button><button class="wc x" aria-label="关闭"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button></div></sc-if>
</header>
<div style="flex:1;min-height:0;display:flex;padding:0 8px 8px">
<nav aria-label="恢复稿列表" style="width:280px;flex:none;background:#fafafa;border:1px solid #e6e6e6;border-right:0;border-radius:10px 0 0 10px;overflow-y:auto;padding:8px 6px;box-sizing:border-box;display:flex;flex-direction:column;gap:2px">
<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<sc-for list="{{items}}" as="d" hint-placeholder-count="4">
<button class="item" style="{{d.style}}" aria-pressed="{{d.on}}" onClick="{{d.pick}}">
<span style="font-size:13px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{d.title}}</span>
<span class="goose-tabular" style="font-size:12px;color:#526071">{{d.meta}}</span>
</button>
</sc-for>
</sc-if>
<sc-if value="{{noItems}}" hint-placeholder-val="{{false}}"><p style="margin:16px 10px;font-size:13px;color:#526071">当前没有待处理的恢复稿。</p></sc-if>
</nav>
<main style="flex:1;min-width:0;background:#ffffff;border:1px solid #e6e6e6;border-radius:0 10px 10px 0;display:flex;flex-direction:column;overflow:hidden">
<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<div style="flex:none;display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #f0f0f0">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{cur.title}}</span><span class="goose-tabular" style="font-size:12px;color:#526071">{{cur.rev}}</span></div>
<button class="btn btn-2" onClick="{{exp}}">导出完整恢复稿</button>
<button class="btn btn-1" onClick="{{open}}">{{cur.openLabel}}</button>
</div>
<div style="flex:1;overflow-y:auto;padding:24px 32px;font-size:14px;line-height:24px">
<sc-if value="{{cur.body}}" hint-placeholder-val="{{true}}"><h3 style="margin:0 0 10px;font-size:18px;font-weight:600">{{cur.title}}</h3><p style="margin:0;white-space:pre-wrap;color:#20242c">{{cur.body}}</p></sc-if>
<sc-if value="{{cur.noBody}}" hint-placeholder-val="{{false}}"><p style="margin:0;color:#526071">此恢复稿没有正文内容。</p></sc-if>
</div>
</sc-if>
<sc-if value="{{noItems}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:grid;place-items:center;font-size:13px;color:#526071">没有需要恢复的内容，可以关闭这个窗口。</div></sc-if>
</main>
</div>
<sc-if value="{{toast}}" hint-placeholder-val="{{false}}"><div role="status" style="position:absolute;left:50%;bottom:24px;transform:translateX(-50%);animation:toast .18s ease-out"><span style="display:block;font-size:13px;color:#ffffff;background:#2f3540;border-radius:8px;padding:8px 12px;white-space:nowrap">{{toast}}</span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["macOS","Windows"],"default":"macOS"},"empty":{"editor":"boolean","default":false},"$preview":{"width":960,"height":680}}'>
var D=[
{title:"把周会改成异步之后",meta:"笔记 · 11月3日 14:20",rev:"版本 18 · 11月3日 14:20",open:"打开原笔记",body:"保留下来的三件事\n\n周一前写好本周目标，一句话即可。\n阻塞问题直接在文档里 @ 负责人。\n周五回看，只记录偏差，不复述进度。"},
{title:"README.md",meta:"本地文件 · 11月2日 22:05",rev:"版本 4 · 11月2日 22:05",open:"打开原笔记",body:"[本地文件的未保存内容]"},
{title:"速记槽 2",meta:"速记槽 2 · 11月1日 09:12",rev:"版本 2 · 11月1日 09:12",open:"打开原速记槽",body:""},
{title:"季度目标草稿",meta:"笔记 · 10月30日 18:40",rev:"版本 7 · 10月30日 18:40",open:"打开原笔记",body:"[恢复稿正文]"}];
class Component extends DCLogic {
constructor(p){super(p);this.state={i:0,toast:""};}
flash(m){this.setState({toast:m});clearTimeout(this._t);this._t=setTimeout(()=>this.setState({toast:""}),2400);}
renderVals(){
var s=this.state,self=this,mac=(this.props.platform||"macOS")==="macOS",empty=!!this.props.empty,c=D[s.i];
return{mac:mac,win:!mac,count:empty?"":D.length+" 份待处理",hasItems:!empty,noItems:empty,
items:D.map((d,i)=>({title:d.title,meta:d.meta,on:i===s.i,style:i===s.i?"background:#e5edfc":"",pick:function(){self.setState({i:i});}})),
cur:{title:c.title,rev:c.rev,openLabel:c.open,body:c.body,noBody:!c.body},
open:()=>this.flash("已在主窗口打开「"+c.title+"」"),exp:()=>this.flash("恢复稿下载已开始。"),toast:s.toast};
}
}
</script>
</body>
</html>
