<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>C 内容取舍 · 生成图片</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3f66b8}
.ib{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;color:#526071;cursor:pointer;transition:background-color .15s,color .15s}
.ib:hover{background:#e6e6e6;color:#20242c}
.btn{font:inherit;font-size:13px;font-weight:460;height:30px;padding:0 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background-color .15s,transform .12s}
.btn:active{transform:scale(.98)}
.btn-2{background:#ffffff;color:#20242c;border:1px solid #dcdcdc}.btn-2:hover{background:#f7f7f7}
.btn-1{background:#2f3540;color:#ffffff;border:0}.btn-1:hover{background:#3b4250}
.txt{font:inherit;font-size:12px;font-weight:460;height:26px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:#526071;cursor:pointer;transition:background-color .15s,color .15s}
.txt:hover{background:#eef3fc;color:#20242c}
.blk{font:inherit;width:100%;display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:0;border-radius:6px;background:transparent;text-align:left;cursor:pointer;transition:background-color .15s,opacity .15s}
.blk:hover{background:#eef3fc}
.dot{width:26px;height:26px;border-radius:13px;border:0;padding:0;cursor:pointer;transition:transform .12s}
.dot:hover{transform:scale(1.08)}
.chip{font:inherit;font-size:12px;font-weight:460;height:28px;padding:0 10px;border-radius:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background-color .15s,color .15s}
@keyframes toast{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:100%;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c;overflow:hidden;position:relative">

<header style="height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px">
<div aria-hidden="true" style="display:flex;gap:8px;width:52px"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span></div>
<button class="ib" aria-label="返回笔记"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
<span style="font-size:14px;font-weight:560">生成图片</span>
<div style="flex:1"></div>
<span class="goose-tabular" style="font-size:12px;color:#526071;margin-right:4px">{{summary}}</span>
<button class="btn btn-2" onClick="{{copy}}">复制</button>
<button class="btn btn-1" onClick="{{save}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>保存图片</button>
</header>

<div style="flex:1;min-height:0;display:flex;gap:8px;padding:0 8px 8px">

<section aria-label="选择内容" style="width:380px;flex:none;display:flex;flex-direction:column;background:#ffffff;border:1px solid #e6e6e6;border-radius:10px;overflow:hidden">
<div style="height:40px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 14px">
<span style="font-size:13px;font-weight:460;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">把周会改成异步之后</span>
<button class="txt" onClick="{{all}}">全选</button>
<button class="txt" onClick="{{selOnly}}">仅编辑器选区</button>
</div>
<div style="flex:1;overflow-y:auto;padding:4px 8px 12px;display:flex;flex-direction:column;gap:2px">
<sc-for list="{{blocks}}" as="b" hint-placeholder-count="7">
<button class="blk" style="{{b.row}}" onClick="{{b.toggle}}" aria-pressed="{{b.on}}">
<span aria-hidden="true" style="{{b.box}}"><sc-if value="{{b.on}}" hint-placeholder-val="{{true}}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></sc-if></span>
<span style="{{b.text}}">{{b.label}}</span>
</button>
</sc-for>
</div>
</section>

<main style="flex:1;min-width:0;display:flex;flex-direction:column;background:#e9e9e9;border:1px solid #e6e6e6;border-radius:10px;overflow:hidden">
<div style="flex:none;display:flex;align-items:center;gap:14px;padding:10px 14px;background:#fafafa;border-bottom:1px solid #e6e6e6">
<div role="radiogroup" aria-label="卡片主题" style="display:flex;align-items:center;gap:6px">
<sc-for list="{{lights}}" as="t" hint-placeholder-count="9"><button class="dot" role="radio" aria-checked="{{t.on}}" aria-label="{{t.name}}" title="{{t.name}}" style="{{t.dot}}" onClick="{{t.pick}}"></button></sc-for>
<span aria-hidden="true" style="width:1px;height:18px;background:#dedede;margin:0 4px"></span>
<sc-for list="{{darks}}" as="t" hint-placeholder-count="6"><button class="dot" role="radio" aria-checked="{{t.on}}" aria-label="{{t.name}}" title="{{t.name}}" style="{{t.dot}}" onClick="{{t.pick}}"></button></sc-for>
</div>
<span style="font-size:13px;font-weight:460;white-space:nowrap">{{themeName}}</span>
</div>

<div style="flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;padding:28px 24px">
<div style="{{stage}}">
<article style="{{card}}">
<sc-for list="{{shown}}" as="b" hint-placeholder-count="6">
<sc-if value="{{b.isH1}}" hint-placeholder-val="{{false}}"><h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;font-weight:650;letter-spacing:-.01em">{{b.label}}</h1></sc-if>
<sc-if value="{{b.isH2}}" hint-placeholder-val="{{false}}"><h2 style="margin:16px 0 6px;font-size:16px;font-weight:600">{{b.label}}</h2></sc-if>
<sc-if value="{{b.isP}}" hint-placeholder-val="{{true}}"><p style="margin:0 0 8px">{{b.label}}</p></sc-if>
<sc-if value="{{b.isLi}}" hint-placeholder-val="{{false}}"><div style="display:flex;gap:8px;margin:0 0 4px"><span aria-hidden="true" style="{{bullet}}"></span><span>{{b.label}}</span></div></sc-if>
<sc-if value="{{b.isQ}}" hint-placeholder-val="{{false}}"><blockquote style="{{quote}}">{{b.label}}</blockquote></sc-if>
<sc-if value="{{b.isImg}}" hint-placeholder-val="{{false}}"><div style="{{img}}">{{b.label}}</div></sc-if>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><p style="margin:0;opacity:.6">在左侧勾选要放进图片的内容</p></sc-if>
<sc-if value="{{showFooter}}" hint-placeholder-val="{{true}}">
<footer style="{{foot}}"><sc-if value="{{showBrand}}" hint-placeholder-val="{{true}}"><span style="font-weight:600">Thinkly</span></sc-if><span style="flex:1"></span><sc-if value="{{showDate}}" hint-placeholder-val="{{true}}"><span class="goose-tabular">{{stamp}}</span></sc-if></footer>
</sc-if>
</article>
</div>
</div>

<div style="flex:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 14px;background:#fafafa;border-top:1px solid #e6e6e6">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><button class="chip" aria-pressed="{{c.on}}" disabled="{{c.disabled}}" style="{{c.style}}" onClick="{{c.toggle}}">{{c.label}}</button></sc-for>
<span style="flex:1"></span>
<label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#526071">宽度
<select style="font:inherit;font-size:13px;height:28px;padding:0 8px;border:1px solid #dcdcdc;border-radius:6px;background:#ffffff;color:#20242c" onChange="{{pickWidth}}"><option value="720">手机 720</option><option value="1080" selected="selected">标准 1080</option><option value="1440">宽屏 1440</option></select>
</label>
</div>
</main>
</div>

<sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #e0e0e0;border-radius:8px;padding:8px 8px 8px 14px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.08);animation:toast .2s ease-out">
<span>{{toast}}</span><a href="#" style="font-weight:460;text-decoration:none;padding:4px 6px">在访达中显示</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
var THEMES=[
{id:"notebook",name:"笔记本",g:"light",bg:"#ffffff",card:"#ffffff",tx:"#20242c",sub:"#5e5d59",ac:"#2563eb",r:12},
{id:"github-light",name:"GitHub 浅色",g:"light",bg:"#f6f8fa",card:"#ffffff",tx:"#1f2328",sub:"#59636e",ac:"#0969da",r:12},
{id:"medium",name:"Medium",g:"light",bg:"#faf9f6",card:"#ffffff",tx:"#242424",sub:"#6b6b6b",ac:"#1a8917",r:4},
{id:"kenya-hara",name:"原研哉",g:"light",bg:"#fefefe",card:"#fefefe",tx:"#333333",sub:"#777777",ac:"#888888",r:0},
{id:"typewriter",name:"打字机",g:"light",bg:"#f5f0e6",card:"#faf6ed",tx:"#3b3226",sub:"#6f604c",ac:"#8b4513",r:2},
{id:"stationery",name:"信笺",g:"light",bg:"#fef9e7",card:"#fffef5",tx:"#3d3a2e",sub:"#6d6652",ac:"#d97706",r:12},
{id:"mocha-mousse",name:"摩卡慕斯",g:"light",bg:"#f5ede0",card:"#fdf8ee",tx:"#3e2f26",sub:"#7a6455",ac:"#a47864",r:18},
{id:"brutalist",name:"粗野主义",g:"light",bg:"#f5f5f5",card:"#ffffff",tx:"#111111",sub:"#555555",ac:"#ff5500",r:0},
{id:"risograph",name:"孔版印刷",g:"light",bg:"#faf5ec",card:"#fffaf0",tx:"#2b2b3a",sub:"#5f5f6e",ac:"#f06f6f",r:4},
{id:"poster",name:"海报",g:"dark",bg:"#121a2c",card:"#121a2c",tx:"#f0efec",sub:"#a9b3c6",ac:"#00d9ff",r:0},
{id:"github-dark",name:"GitHub 深色",g:"dark",bg:"#0d1117",card:"#0d1117",tx:"#e6edf3",sub:"#9198a1",ac:"#2f81f7",r:12},
{id:"vercel-dark",name:"Vercel",g:"dark",bg:"#0a0a0a",card:"#0a0a0a",tx:"#ededed",sub:"#a1a1a1",ac:"#ffffff",r:0},
{id:"tokyo-night",name:"Tokyo Night",g:"dark",bg:"#1a1b26",card:"#24283b",tx:"#c0caf5",sub:"#9aa5ce",ac:"#7aa2f7",r:14},
{id:"catppuccin",name:"Catppuccin",g:"dark",bg:"#24273a",card:"#1e2030",tx:"#cad3f5",sub:"#a5adcb",ac:"#c6a0f6",r:14},
{id:"synthwave",name:"合成波",g:"dark",bg:"#170a2e",card:"#1c0d38",tx:"#f5e9ff",sub:"#b9a6d6",ac:"#ff2a6d",r:18}];
var BLOCKS=[
{k:"h1",t:"把周会改成异步之后"},
{k:"p",t:"试了六周，周会从每周一小时缩成十五分钟的站会，其余全部放进共享文档。"},
{k:"p",t:"最明显的变化是：讨论变少了，但决定变快了。"},
{k:"img",t:"图片 · 白板照片"},
{k:"h2",t:"保留下来的三件事"},
{k:"li",t:"周一前写好本周目标，一句话即可"},
{k:"li",t:"阻塞问题直接在文档里 @ 负责人"},
{k:"li",t:"周五回看，只记录偏差"},
{k:"q",t:"异步不是少沟通，而是把沟通写下来。"},
{k:"p",t:"下一步：把站会也试着取消两周，看看会不会漏掉什么。"}];
var SEL=[4,5,6,7,8];
class Component extends DCLogic {
constructor(p){super(p);this.state={theme:"notebook",on:BLOCKS.map((b,i)=>i!==3&&i!==9),width:1080,footer:true,brand:true,date:true,time:false,toast:""};}
flash(m){this.setState({toast:m});clearTimeout(this._t);this._t=setTimeout(()=>this.setState({toast:""}),2600);}
renderVals(){
var s=this.state,self=this,T=THEMES.find(t=>t.id===s.theme),dark=T.g==="dark";
var mkDot=function(t){var a=t.id===s.theme;return{name:t.name,on:a,pick:()=>self.setState({theme:t.id}),
dot:"background:"+t.bg+";box-shadow:inset -13px 0 0 "+t.ac+","+(a?"0 0 0 2px #fafafa,0 0 0 3px #547dd0":"inset 0 0 0 1px rgba(0,0,0,.12)")};};
var chip=function(k,l,dis){var v=s[k]&&!dis;return{label:l,on:!!s[k],disabled:!!dis,toggle:()=>{if(!dis)self.setState({[k]:!s[k]})},
style:v?"background:#e5edfc;color:#20242c;border:1px solid #547dd0":"background:#ffffff;color:"+(dis?"#8b95a3":"#526071")+";border:1px solid #dcdcdc"+(dis?";cursor:default":"")};};
var label={h1:"标题",h2:"小标题",p:"",li:"",q:"",img:""};
var blocks=BLOCKS.map(function(b,i){var on=s.on[i],head=b.k==="h1"||b.k==="h2";return{label:(b.k==="li"?"• ":"")+b.t,on:on,
toggle:()=>{var n=s.on.slice();n[i]=!n[i];self.setState({on:n})},
row:on?"":"opacity:.45",
box:"flex:none;margin-top:2px;width:16px;height:16px;border-radius:4px;display:grid;place-items:center;box-sizing:border-box;"+(on?"background:#547dd0":"border:1.5px solid #b9c0ca"),
text:"font-size:"+(b.k==="h1"?"15px;font-weight:600":b.k==="h2"?"14px;font-weight:560":"13px")+";line-height:20px;color:"+(b.k==="q"||b.k==="img"?"#526071":"#20242c")+(b.k==="q"?";font-style:italic":"")};});
var shown=BLOCKS.map((b,i)=>({label:b.t,isH1:b.k==="h1",isH2:b.k==="h2",isP:b.k==="p",isLi:b.k==="li",isQ:b.k==="q",isImg:b.k==="img"})).filter((b,i)=>s.on[i]);
var n=s.on.filter(Boolean).length;
var cw=s.width===720?380:s.width===1440?600:480;
var now=new Date(),dd=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
return{
blocks:blocks,shown:shown,empty:n===0,summary:n+" / "+BLOCKS.length+" 块 · "+s.width+" px",
all:()=>this.setState({on:BLOCKS.map(()=>true)}),selOnly:()=>this.setState({on:BLOCKS.map((b,i)=>SEL.indexOf(i)>=0)}),
lights:THEMES.filter(t=>t.g==="light").map(mkDot),darks:THEMES.filter(t=>t.g==="dark").map(mkDot),themeName:T.name,
chips:[chip("footer","底部栏"),chip("brand","品牌",!s.footer),chip("date","日期",!s.footer),chip("time","时分秒",!s.footer||!s.date)],
pickWidth:(e)=>this.setState({width:Number(e.target.value)}),
showFooter:s.footer,showBrand:s.brand,showDate:s.date,stamp:s.time?dd+" 14:32:08":dd,
stage:"width:"+cw+"px;flex:none;align-self:flex-start;background:"+T.bg+";padding:24px;box-sizing:border-box;box-shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);transition:background-color .2s",
card:"background:"+T.card+";color:"+T.tx+";border-radius:"+T.r+"px;padding:28px 26px;font-size:14px;line-height:1.7;transition:background-color .2s,color .2s",
bullet:"flex:none;width:5px;height:5px;border-radius:3px;margin-top:10px;background:"+T.ac,
quote:"margin:12px 0 8px;padding:2px 0 2px 12px;border-left:3px solid "+T.ac+";color:"+T.sub,
img:"height:120px;margin:4px 0 12px;border-radius:"+Math.min(T.r,8)+"px;display:grid;place-items:center;font-size:12px;color:"+T.sub+";background:"+(dark?"rgba(255,255,255,.06)":"rgba(0,0,0,.05)"),
foot:"display:flex;gap:8px;margin-top:20px;padding-top:10px;border-top:1px solid "+(dark?"rgba(255,255,255,.12)":"rgba(0,0,0,.08)")+";font-size:11px;color:"+T.sub,
copy:()=>this.flash("已复制到剪贴板"),save:()=>this.flash("已保存 把周会改成异步之后.png"),toast:s.toast};
}
}
</script>
</body>
</html>
