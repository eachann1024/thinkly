<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>更新日志</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3f66b8}
.wc{width:46px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:#20242c;cursor:pointer;transition:background-color .15s,color .15s}
.wc:hover{background:#e4e4e4}.wc.x:hover{background:#c42b1c;color:#ffffff}
.btn{font:inherit;font-size:13px;font-weight:460;height:32px;padding:0 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background-color .15s,transform .12s,opacity .15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn-2{background:#ffffff;color:#20242c;border:1px solid #dcdcdc}.btn-2:hover{background:#f7f7f7}
.btn-1{background:#2f3540;color:#ffffff;border:0}.btn-1:hover{background:#3b4250}
.md h3{margin:20px 0 8px;font-size:13px;font-weight:560}
.md h3:first-child{margin-top:0}
.md ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.md li{font-size:13px;line-height:20px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:600px;height:680px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c;overflow:hidden">
<header style="height:44px;flex:none;display:flex;align-items:center;gap:10px;padding-left:16px">
<sc-if value="{{mac}}" hint-placeholder-val="{{true}}"><div aria-hidden="true" style="display:flex;gap:8px;width:60px"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#d9d9d9"></span></div></sc-if>
<span style="font-size:14px;font-weight:560">v1.7.346 更新日志</span>
<span style="font-size:13px;color:#526071">[发布日期]</span>
<span style="flex:1"></span>
<sc-if value="{{win}}" hint-placeholder-val="{{false}}"><div style="display:flex"><button class="wc" aria-label="最小化"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor"/></svg></button><button class="wc x" aria-label="关闭"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button></div></sc-if>
</header>
<div style="flex:1;min-height:0;margin:0 8px 8px;background:#ffffff;border:1px solid #e6e6e6;border-radius:10px;display:flex;flex-direction:column;overflow:hidden">
<div class="md" style="flex:1;overflow-y:auto;padding:24px 28px">
<h3>新功能</h3>
<ul><li>生成图片改为独立窗口，可选主题、宽度与底部栏。</li><li>反思改为独立窗口，可以一边看一边在主窗口里写。</li></ul>
<h3>改进</h3>
<ul><li>格式工具栏去掉列表类型分组，清除格式并入文字样式组。</li><li>AI 面板的展开和收起动画更顺，悬停反馈补齐。</li></ul>
<h3>修复</h3>
<ul><li>打开本地文件时不再重复显示开头的标题。</li></ul>
</div>
<footer style="flex:none;display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-top:1px solid #f0f0f0">
<sc-if value="{{downloading}}" hint-placeholder-val="{{false}}">
<div style="display:flex;flex-direction:column;gap:6px">
<div role="progressbar" aria-label="更新下载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}" style="height:6px;border-radius:3px;background:#eeeeee;overflow:hidden"><div style="{{bar}}"></div></div>
<span class="goose-tabular" role="status" aria-live="polite" style="font-size:12px;color:#526071">{{status}}</span>
</div>
</sc-if>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
<span style="font-size:12px;color:#526071">{{hint}}</span>
<button class="btn btn-1" style="min-width:112px" disabled="{{busy}}" onClick="{{act}}">
<sc-if value="{{busy}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#ffffff;animation:spin .8s linear infinite"></span></sc-if>{{label}}</button>
</div>
</footer>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["macOS","Windows"],"default":"macOS"},"$preview":{"width":600,"height":680}}'>
class Component extends DCLogic {
constructor(p){super(p);this.state={phase:"idle",pct:0};}
componentWillUnmount(){clearInterval(this._i);}
start(){this.setState({phase:"down",pct:0});clearInterval(this._i);this._i=setInterval(()=>{var p=this.state.pct+9;if(p>=100){clearInterval(this._i);this.setState({phase:"ready",pct:100});}else this.setState({pct:p});},220);}
renderVals(){
var s=this.state,mac=(this.props.platform||"macOS")==="macOS";
var L={idle:"立即更新",down:"正在下载",ready:"重启并更新",restart:"正在重启…"};
return{mac:mac,win:!mac,
downloading:s.phase==="down"||s.phase==="ready",pct:s.pct,
bar:"height:100%;width:"+s.pct+"%;background:#547dd0;transition:width .2s",
status:s.phase==="ready"?"下载完成":"已下载 "+s.pct+"%",
hint:s.phase==="down"?"关掉窗口也会在后台继续下载":s.phase==="ready"?"重启 Thinkly 即完成更新":"当前版本 v1.7.345",
busy:s.phase==="down"||s.phase==="restart",label:L[s.phase],
act:()=>{if(s.phase==="idle")this.start();else if(s.phase==="ready")this.setState({phase:"restart"});}};
}
}
</script>
</body>
</html>
