<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>配置 AI 写作助手</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3f66b8}
.wc{width:46px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:#20242c;cursor:pointer;transition:background-color .15s,color .15s}
.wc:hover{background:#e4e4e4}.wc.x:hover{background:#c42b1c;color:#ffffff}
.btn{font:inherit;font-size:13px;font-weight:460;height:32px;padding:0 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background-color .15s,transform .12s,opacity .15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn-2{background:#ffffff;color:#20242c;border:1px solid #dcdcdc}.btn-2:hover{background:#f7f7f7}
.btn-1{background:#2f3540;color:#ffffff;border:0}.btn-1:hover{background:#3b4250}
.btn-t{background:transparent;color:#526071;border:0;padding:0 8px}.btn-t:hover{background:#f1f1f1;color:#20242c}
.in{font:inherit;font-size:13px;width:100%;box-sizing:border-box;height:34px;padding:0 10px;border:1px solid #dcdcdc;border-radius:8px;background:#ffffff;color:#20242c;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:#547dd0;box-shadow:0 0 0 3px #e5edfc}
.pv{font:inherit;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;background:#ffffff;color:#20242c;text-align:left;cursor:pointer;transition:border-color .15s,background-color .15s}
.pv:hover{background:#fafafa}
.lab{font-size:12px;font-weight:460;color:#526071}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="width:640px;height:680px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c;overflow:hidden">
<header style="height:44px;flex:none;display:flex;align-items:center;gap:10px;padding-left:16px">
<sc-if value="{{mac}}" hint-placeholder-val="{{true}}"><div aria-hidden="true" style="display:flex;gap:8px;width:60px"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#d9d9d9"></span></div></sc-if>
<span style="font-size:14px;font-weight:560">配置 AI 写作助手</span>
<span style="flex:1"></span>
<sc-if value="{{win}}" hint-placeholder-val="{{false}}"><div style="display:flex"><button class="wc" aria-label="最小化"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor"/></svg></button><button class="wc x" aria-label="关闭"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button></div></sc-if>
</header>
<div style="flex:1;min-height:0;margin:0 8px 8px;background:#ffffff;border:1px solid #e6e6e6;border-radius:10px;display:flex;flex-direction:column;overflow:hidden">
<div style="flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px">
<p style="margin:0;font-size:13px;line-height:20px;color:#526071">选择服务商，保存配置并选择模型。保存后这个窗口会自动关闭，主窗口的 AI 面板立即可用。</p>
<div style="display:flex;flex-direction:column;gap:8px">
<span class="lab" id="pv-lab">服务商</span>
<div role="group" aria-labelledby="pv-lab" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<sc-for list="{{providers}}" as="p" hint-placeholder-count="4">
<button class="pv" style="{{p.style}}" aria-pressed="{{p.on}}" onClick="{{p.pick}}"><span style="font-size:13px;font-weight:560">{{p.name}}</span><span style="font-size:12px;color:#526071">{{p.desc}}</span></button>
</sc-for>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<label class="lab" for="ai-key">API Key</label>
<input id="ai-key" class="in" type="password" placeholder="粘贴服务商提供的 API Key" value="{{key}}" onInput="{{setKey}}">
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<label class="lab" for="ai-model">模型</label>
<select id="ai-model" class="in" disabled="{{noKey}}"><sc-for list="{{models}}" as="m" hint-placeholder-count="2"><option>{{m}}</option></sc-for></select>
<span style="font-size:12px;color:#526071">{{modelHint}}</span>
</div>
</div>
<footer style="flex:none;display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid #f0f0f0">
<button class="btn btn-t">打开完整设置</button>
<span style="flex:1"></span>
<button class="btn btn-2">稍后配置</button>
<button class="btn btn-1" disabled="{{noKey}}">保存</button>
</footer>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["macOS","Windows"],"default":"macOS"},"$preview":{"width":640,"height":680}}'>
var P=[{name:"Anthropic",desc:"Claude 系列",m:["claude-sonnet-5-5","claude-opus-5-5"]},{name:"OpenAI",desc:"GPT 系列",m:["[模型名称]"]},{name:"OpenRouter",desc:"一个 Key 用多家模型",m:["[模型名称]"]},{name:"自定义",desc:"兼容 OpenAI 的接口地址",m:["[模型名称]"]}];
class Component extends DCLogic {
constructor(p){super(p);this.state={i:0,key:""};}
renderVals(){
var s=this.state,self=this,mac=(this.props.platform||"macOS")==="macOS",noKey=!s.key.trim();
return{mac:mac,win:!mac,
providers:P.map((p,i)=>({name:p.name,desc:p.desc,on:i===s.i,style:i===s.i?"border-color:#547dd0;background:#f4f7fd":"",pick:function(){self.setState({i:i});}})),
key:s.key,setKey:(e)=>this.setState({key:e.target.value}),noKey:noKey,
models:P[s.i].m,modelHint:noKey?"填写 API Key 后可选择模型":"已读取可用模型"};
}
}
</script>
</body>
</html>
