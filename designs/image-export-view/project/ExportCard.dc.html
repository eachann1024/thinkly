<html lang="zh-Hans">

<style>

<div style="{{frame}}">

<sc-for list="{{cd}}" as="d" hint-placeholder-count="0"><span aria-hidden="true" style="{{d.s}}"></span></sc-for>
<sc-if value="{{titlePre}}" hint-placeholder-val="{{false}}"><div aria-hidden="true" style="{{titlePreS}}">· · ·</div></sc-if>
<sc-if value="{{showTitle}}" hint-placeholder-val="{{true}}"><h1 style="{{h1}}">{{heading}}</h1></sc-if>
<sc-if value="{{afterRule}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{afterRuleS}}"></span></sc-if>
<sc-for list="{{blocks}}" as="b" hint-placeholder-count="6">

<sc-if value="{{b.isLi}}" hint-placeholder-val="{{false}}"><div style="{{li}}"><span aria-hidden="true" style="{{bullet}}"></span><span>{{b.t}}</span></div></sc-if>
<sc-if value="{{b.isQ}}" hint-placeholder-val="{{false}}"><blockquote style="{{q}}"><sc-if value="{{quoteMark}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{quoteMarkS}}">“</span></sc-if>{{b.t}}</blockquote></sc-if>
<sc-if value="{{b.isImg}}" hint-placeholder-val="{{false}}"><div style="{{img}}">{{b.t}}</div></sc-if>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><p style="{{emptyS}}">没有可导出的内容</p></sc-if>
<sc-if value="{{showFoot}}" hint-placeholder-val="{{true}}">
<footer style="{{foot}}">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<sc-if value="{{brand}}" hint-placeholder-val="{{true}}"><span style="{{brandS}}">{{brand}}</span></sc-if>
<sc-if value="{{stamp}}" hint-placeholder-val="{{true}}"><span style="font-variant-numeric:tabular-nums">{{stamp}}</span></sc-if>
</div>
</footer>
</sc-if>
</article>
<sc-if value="{{qr}}" hint-placeholder-val="{{false}}"><div role="img" aria-label="贡献图点阵，暗含二维码，扫码打开 note.cooool.top" style="{{bandS}}"><sc-for list="{{band}}" as="c" hint-placeholder-count="0"><span style="{{c.s}}"></span></sc-for></div></sc-if>
