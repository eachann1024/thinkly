<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>编辑笔记本</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3f66b8}
.wc{width:46px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:#20242c;cursor:pointer;transition:background-color .15s,color .15s}
.wc:hover{background:#e4e4e4}.wc.x:hover{background:#c42b1c;color:#ffffff}
.btn{font:inherit;font-size:13px;font-weight:460;height:32px;padding:0 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background-color .15s,transform .12s,opacity .15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn-2{background:#ffffff;color:#20242c;border:1px solid #dcdcdc}.btn-2:hover{background:#f7f7f7}
.btn-1{background:#2f3540;color:#ffffff;border:0}.btn-1:hover{background:#3b4250}
.btn-d{background:#c42b1c;color:#ffffff;border:0}.btn-d:hover{background:#a82416}
.btn-q{background:transparent;color:#b42318;border:0;padding:0 8px}.btn-q:hover{background:#fdf3f2}
.in{font:inherit;font-size:13px;width:100%;box-sizing:border-box;height:34px;padding:0 10px;border:1px solid #dcdcdc;border-radius:8px;background:#ffffff;color:#20242c;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:#547dd0;box-shadow:0 0 0 3px #e5edfc}
.ico{width:40px;height:40px;border-radius:8px;border:1px solid #e0e0e0;background:#ffffff;display:grid;place-items:center;font-size:18px;cursor:pointer;color:#526071;transition:background-color .15s}
.ico:hover{background:#f4f4f4}
.sw{position:relative;width:30px;height:18px;border-radius:9px;border:0;padding:0;cursor:pointer;flex:none;transition:background-color .15s}
.sw span{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:#fff;transition:transform .15s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="width:560px;height:680px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c;overflow:hidden">
<header style="height:44px;flex:none;display:flex;align-items:center;gap:10px;padding-left:16px">
<sc-if value="{{mac}}" hint-placeholder-val="{{true}}"><div aria-hidden="true" style="display:flex;gap:8px;width:60px"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#d9d9d9"></span><span style="width:12px;height:12px;border-radius:6px;background:#d9d9d9"></span></div></sc-if>
<span style="font-size:14px;font-weight:560">{{title}}</span>
<span style="font-size:13px;color:#526071;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">工作笔记</span>
<span style="flex:1"></span>
<sc-if value="{{win}}" hint-placeholder-val="{{false}}"><button class="wc x" aria-label="关闭"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button></sc-if>
</header>

<div style="flex:1;min-height:0;margin:0 8px 8px;background:#ffffff;border:1px solid #e6e6e6;border-radius:10px;display:flex;flex-direction:column;overflow:hidden">
<sc-if value="{{editing}}" hint-placeholder-val="{{true}}">
<div style="flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:22px">
<p style="margin:0;font-size:13px;color:#526071">修改笔记本的名称、图标与搜索设置</p>
<div style="display:flex;flex-direction:column;gap:8px">
<label for="nb-name" style="font-size:12px;font-weight:460;color:#526071">笔记本名称</label>
<div style="display:flex;gap:8px"><button class="ico" aria-label="更换图标"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></button><input id="nb-name" class="in" style="height:40px" placeholder="输入笔记本名称" value="{{name}}" onInput="{{setName}}"></div>
</div>
<div style="display:flex;align-items:flex-start;gap:16px;padding:14px;background:#fafafa;border:1px solid #ececec;border-radius:10px">
<div style="flex:1"><div style="font-size:13px;font-weight:560">不在全局搜索中展示</div><div style="margin-top:4px;font-size:12px;line-height:18px;color:#526071">开启后，从其他笔记本搜索「所有笔记本」时排除该笔记本；当前笔记本内搜索不受影响。</div></div>
<button class="sw" role="switch" aria-checked="{{exclude}}" aria-label="不在全局搜索中展示" style="{{swTrack}}" onClick="{{toggle}}"><span style="{{swKnob}}"></span></button>
</div>
<div style="flex:1"></div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid #f0f0f0">
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:13px;font-weight:560">危险操作</span><span style="font-size:12px;color:#526071">本地文件夹只移除挂载，不删除磁盘文件</span></div>
<div style="display:flex;gap:4px"><button class="btn btn-q" onClick="{{askRemove}}">移除此笔记本</button><button class="btn btn-q" onClick="{{askDelete}}">删除此笔记本</button></div>
</div>
</div>
<footer style="flex:none;display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid #f0f0f0">
<button class="btn btn-2">取消</button><button class="btn btn-1" disabled="{{noName}}">保存</button>
</footer>
</sc-if>

<sc-if value="{{confirming}}" hint-placeholder-val="{{false}}">
<div style="flex:1;padding:28px 24px;display:flex;flex-direction:column;gap:14px">
<span aria-hidden="true" style="width:36px;height:36px;border-radius:10px;background:#fdf3f2;color:#b42318;display:grid;place-items:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 4.3L2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/></svg></span>
<h2 style="margin:0;font-size:17px;font-weight:600">{{cTitle}}</h2>
<p style="margin:0;font-size:13px;line-height:20px;color:#526071">{{cBody}}</p>
<div style="padding:12px 14px;background:#fafafa;border:1px solid #ececec;border-radius:8px;font-size:13px;display:flex;justify-content:space-between"><span>工作笔记</span><span class="goose-tabular" style="color:#526071">128 篇笔记</span></div>
</div>
<footer style="flex:none;display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid #f0f0f0">
<button class="btn btn-2" onClick="{{back}}">返回</button><button class="btn btn-d">{{cAction}}</button>
</footer>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["macOS","Windows"],"default":"macOS"},"$preview":{"width":560,"height":680}}'>
class Component extends DCLogic {
constructor(p){super(p);this.state={view:"edit",name:"工作笔记",exclude:false};}
renderVals(){
var s=this.state,mac=(this.props.platform||"macOS")==="macOS",del=s.view==="delete";
return{mac:mac,win:!mac,
title:s.view==="edit"?"编辑笔记本":del?"永久删除笔记本":"移除本地文件夹",
editing:s.view==="edit",confirming:s.view!=="edit",
name:s.name,setName:(e)=>this.setState({name:e.target.value}),noName:!s.name.trim(),
exclude:s.exclude,toggle:()=>this.setState({exclude:!s.exclude}),
swTrack:"background:"+(s.exclude?"#547dd0":"#d6d6d6"),swKnob:s.exclude?"transform:translateX(12px)":"",
askRemove:()=>this.setState({view:"remove"}),askDelete:()=>this.setState({view:"delete"}),back:()=>this.setState({view:"edit"}),
cTitle:del?"永久删除「工作笔记」？":"移除「工作笔记」？",
cBody:del?"笔记本和其中的所有笔记都会被删除。此操作无法撤销，请谨慎操作。":"仅移除挂载，不会删除磁盘上的文件。之后可以重新添加这个文件夹。",
cAction:del?"确认删除":"确认移除"};
}
}
</script>
</body>
</html>
