<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>确认窗口 · 重置设置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3f66b8}
.wc{width:46px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:#20242c;cursor:pointer;transition:background-color .15s,color .15s}
.wc:hover{background:#e4e4e4}.wc.x:hover{background:#c42b1c;color:#ffffff}
.btn{font:inherit;font-size:13px;font-weight:460;height:32px;padding:0 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background-color .15s,transform .12s,opacity .15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn-2{background:#ffffff;color:#20242c;border:1px solid #dcdcdc}.btn-2:hover{background:#f7f7f7}
.btn-d{background:#c42b1c;color:#ffffff;border:0}.btn-d:hover{background:#a82416}
.in{font:inherit;font-size:13px;width:100%;box-sizing:border-box;height:34px;padding:0 10px;border:1px solid #dcdcdc;border-radius:8px;background:#ffffff;color:#20242c;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:#547dd0;box-shadow:0 0 0 3px #e5edfc}
.ck{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.ck input{width:16px;height:16px;margin:0;accent-color:#547dd0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</helmet>
<div style="width:460px;height:400px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c;overflow:hidden">
<header style="height:44px;flex:none;display:flex;align-items:center;gap:10px;padding-left:16px">
<sc-if value="{{mac}}" hint-placeholder-val="{{true}}"><div aria-hidden="true" style="display:flex;gap:8px;width:60px"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#d9d9d9"></span><span style="width:12px;height:12px;border-radius:6px;background:#d9d9d9"></span></div></sc-if>
<span style="font-size:14px;font-weight:560">重置设置</span>
<span style="font-size:12px;color:#526071">Esc 取消</span>
<span style="flex:1"></span>
<sc-if value="{{win}}" hint-placeholder-val="{{false}}"><button class="wc x" aria-label="关闭"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button></sc-if>
</header>
<div style="flex:1;min-height:0;margin:0 8px 8px;background:#ffffff;border:1px solid #e6e6e6;border-radius:10px;display:flex;flex-direction:column;overflow:hidden">
<div style="flex:1;padding:20px 20px 0;display:flex;flex-direction:column;gap:14px">
<div><h2 style="margin:0;font-size:16px;font-weight:600">确认重置设置？</h2><p style="margin:6px 0 0;font-size:13px;line-height:20px;color:#526071">将恢复偏好设置，不会清理笔记本。</p></div>
<fieldset style="margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:8px">
<legend style="padding:0;margin-bottom:8px;font-size:12px;font-weight:460;color:#526071">同时清空</legend>
<label class="ck"><input type="checkbox">历史版本</label>
<label class="ck"><input type="checkbox">AI 对话</label>
</fieldset>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="cf" style="font-size:12px;color:#526071">请输入以下短语以确认重置：<b style="color:#20242c;font-weight:560">重置设置</b></label>
<input id="cf" class="in" value="{{v}}" onInput="{{setV}}" autocomplete="off">
</div>
</div>
<footer style="flex:none;display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;margin-top:14px;border-top:1px solid #f0f0f0">
<button class="btn btn-2">取消</button><button class="btn btn-d" disabled="{{locked}}">重置</button>
</footer>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["macOS","Windows"],"default":"macOS"},"$preview":{"width":460,"height":400}}'>
class Component extends DCLogic {
constructor(p){super(p);this.state={v:""};}
renderVals(){
var mac=(this.props.platform||"macOS")==="macOS";
return{mac:mac,win:!mac,v:this.state.v,setV:(e)=>this.setState({v:e.target.value}),locked:this.state.v.trim()!=="重置设置"};
}
}
</script>
</body>
</html>
