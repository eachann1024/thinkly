<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>B 沉浸画布 · 生成图片</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#547dd0}a:hover{color:#3f66b8}
.ib{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:6px;background:transparent;color:#526071;cursor:pointer;transition:background-color .15s,color .15s}
.ib:hover{background:#e6e6e6;color:#20242c}
.btn{font:inherit;font-size:13px;font-weight:460;height:30px;padding:0 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background-color .15s,transform .12s}
.btn:active{transform:scale(.98)}
.btn-2{background:#ffffff;color:#20242c;border:1px solid #dcdcdc}.btn-2:hover{background:#f7f7f7}
.btn-1{background:#2f3540;color:#ffffff;border:0}.btn-1:hover{background:#3b4250}
.seg{font:inherit;font-size:12px;font-weight:460;height:26px;padding:0 12px;border:0;border-radius:6px;cursor:pointer;transition:background-color .15s,color .15s}
.nav{width:36px;height:36px;display:grid;place-items:center;border-radius:18px;border:1px solid #dedede;background:#ffffff;color:#526071;cursor:pointer;transition:background-color .15s,color .15s,transform .12s}
.nav:hover{background:#eef3fc;color:#20242c}.nav:active{transform:scale(.96)}
.thumb{font:inherit;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px;border:0;border-radius:8px;background:transparent;cursor:pointer;transition:background-color .15s}
.thumb:hover{background:#eef3fc}
.mi{font:inherit;width:100%;min-height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border:0;border-radius:4px;background:transparent;color:#20242c;font-size:14px;cursor:pointer}
.mi:hover{background:#eef3fc}
.sw{position:relative;width:30px;height:18px;border-radius:9px;flex:none}
.sw span{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:#fff;transition:transform .15s}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toast{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:100%;height:800px;box-sizing:border-box;display:flex;flex-direction:column;background:#f1f1f1;font-family:Inter,-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#20242c;overflow:hidden;position:relative">

<header style="height:44px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px 0 16px">
<div style="display:flex;align-items:center;gap:8px;min-width:0">
<div aria-hidden="true" style="display:flex;gap:8px;width:52px;flex:none"><span style="width:12px;height:12px;border-radius:6px;background:#ff5f57"></span><span style="width:12px;height:12px;border-radius:6px;background:#febc2e"></span><span style="width:12px;height:12px;border-radius:6px;background:#28c840"></span></div>
<button class="ib" aria-label="返回笔记"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
<span style="font-size:13px;color:#526071;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">把周会改成异步之后</span>
</div>
<div style="display:flex;padding:2px;background:#e4e4e4;border-radius:8px">
<button class="seg" style="{{scopePage}}" onClick="{{pickPage}}">整页</button>
<button class="seg" style="{{scopeSel}}" onClick="{{pickSel}}">选中内容</button>
</div>
<div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;position:relative">
<button class="ib" aria-label="生成选项" aria-expanded="{{menu}}" style="{{menuBtn}}" onClick="{{toggleMenu}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
<button class="btn btn-2" onClick="{{copy}}">复制</button>
<button class="btn btn-1" onClick="{{save}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>保存图片</button>

<sc-if value="{{menu}}" hint-placeholder-val="{{false}}">
<div role="menu" style="position:absolute;top:38px;right:150px;width:232px;z-index:5;background:#ffffff;border:1px solid #e3e3e3;border-radius:8px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.10);display:flex;flex-direction:column;gap:2px;animation:pop .2s ease-out;transform-origin:top right">
<div style="padding:4px 8px;font-size:12px;color:#526071">图片宽度</div>
<div style="display:flex;padding:2px;margin:0 2px 6px;background:#f1f1f1;border-radius:8px">
<sc-for list="{{widths}}" as="w" hint-placeholder-count="3"><button class="seg" style="flex:1;padding:0;{{w.style}}" onClick="{{w.pick}}">{{w.label}}</button></sc-for>
</div>
<sc-for list="{{opts}}" as="o" hint-placeholder-count="5">
<button class="mi" role="menuitemcheckbox" aria-checked="{{o.on}}" disabled="{{o.disabled}}" style="{{o.rowStyle}}" onClick="{{o.toggle}}"><span>{{o.label}}</span><span class="sw" aria-hidden="true" style="{{o.track}}"><span style="{{o.knob}}"></span></span></button>
</sc-for>
</div>
</sc-if>
</div>
</header>

<main style="flex:1;min-height:0;margin:0 8px;border-radius:10px;background:#e7e7e7;position:relative;display:flex;align-items:center;justify-content:center;gap:28px;overflow:hidden">
<button class="nav" aria-label="上一个主题" onClick="{{prev}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
<div style="display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;box-sizing:border-box;padding:20px 8px 24px;overflow-y:auto;scrollbar-width:none">
<div style="font-size:12px;color:#526071;display:flex;gap:8px"><span style="color:#20242c;font-weight:460">{{themeName}}</span><span class="goose-tabular">{{pos}}</span></div>
<div style="{{stage}}">
<article style="{{card}}">
<sc-if value="{{showTitle}}" hint-placeholder-val="{{true}}"><h1 style="margin:0 0 12px;font-size:26px;line-height:1.3;font-weight:650;letter-spacing:-.01em">把周会改成异步之后</h1></sc-if>
<p style="margin:0">试了六周，周会从每周一小时缩成十五分钟的站会，其余全部放进共享文档。最明显的变化是：讨论变少了，但决定变快了。</p>
<h2 style="margin:18px 0 6px;font-size:17px;font-weight:600">保留下来的三件事</h2>
<ul style="margin:0;padding-left:20px"><li>周一前写好本周目标，一句话即可</li><li>阻塞问题直接在文档里 @ 负责人</li><li>周五回看，只记录偏差</li></ul>
<blockquote style="{{quote}}">异步不是少沟通，而是把沟通写下来。</blockquote>
<sc-if value="{{showFooter}}" hint-placeholder-val="{{true}}">
<footer style="{{foot}}"><sc-if value="{{showBrand}}" hint-placeholder-val="{{true}}"><span style="font-weight:600">Thinkly</span></sc-if><span style="flex:1"></span><sc-if value="{{showDate}}" hint-placeholder-val="{{true}}"><span class="goose-tabular">{{stamp}}</span></sc-if></footer>
</sc-if>
</article>
</div>
</div>
<button class="nav" aria-label="下一个主题" onClick="{{next}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
</main>

<nav aria-label="卡片主题" style="flex:none;height:118px;margin:8px 8px 8px;display:flex;align-items:center;gap:12px;background:#fafafa;border:1px solid #e6e6e6;border-radius:10px;padding:0 12px">
<div style="display:flex;flex-direction:column;gap:2px;flex:none;width:72px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3"><button class="seg" style="text-align:left;{{f.style}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for>
</div>
<div style="flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;padding:4px 0;scrollbar-width:thin">
<sc-for list="{{thumbs}}" as="t" hint-placeholder-count="10">
<button class="thumb" style="{{t.wrap}}" onClick="{{t.pick}}" aria-pressed="{{t.on}}">
<span aria-hidden="true" style="{{t.frame}}"><span style="{{t.cardBox}}"><span style="{{t.line1}}"></span><span style="{{t.line2}}"></span><span style="{{t.line3}}"></span></span></span>
<span style="font-size:12px;line-height:16px;color:#20242c;white-space:nowrap">{{t.name}}</span>
</button>
</sc-for>
</div>
</nav>

<sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position:absolute;left:50%;bottom:142px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#ffffff;border:1px solid #e0e0e0;border-radius:8px;padding:8px 8px 8px 14px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.08);animation:toast .2s ease-out">
<span>{{toast}}</span><a href="#" style="font-weight:460;text-decoration:none;padding:4px 6px">在访达中显示</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
var THEMES=[
{id:"notebook",name:"笔记本",g:"light",bg:"#ffffff",card:"#ffffff",tx:"#20242c",sub:"#5e5d59",ac:"#2563eb",r:12},
{id:"github-light",name:"GitHub 浅色",g:"light",bg:"#f6f8fa",card:"#ffffff",tx:"#1f2328",sub:"#59636e",ac:"#0969da",r:12},
{id:"medium",name:"Medium",g:"light",bg:"#faf9f6",card:"#ffffff",tx:"#242424",sub:"#6b6b6b",ac:"#1a8917",r:4},
{id:"kenya-hara",name:"原研哉",g:"light",bg:"#fefefe",card:"#fefefe",tx:"#333333",sub:"#777777",ac:"#888888",r:0},
{id:"typewriter",name:"打字机",g:"light",bg:"#f5f0e6",card:"#faf6ed",tx:"#3b3226",sub:"#6f604c",ac:"#8b4513",r:2},
{id:"stationery",name:"信笺",g:"light",bg:"#fef9e7",card:"#fffef5",tx:"#3d3a2e",sub:"#6d6652",ac:"#d97706",r:12},
{id:"mocha-mousse",name:"摩卡慕斯",g:"light",bg:"#f5ede0",card:"#fdf8ee",tx:"#3e2f26",sub:"#7a6455",ac:"#a47864",r:18},
{id:"brutalist",name:"粗野主义",g:"light",bg:"#f5f5f5",card:"#ffffff",tx:"#111111",sub:"#555555",ac:"#ff5500",r:0},
{id:"risograph",name:"孔版印刷",g:"light",bg:"#faf5ec",card:"#fffaf0",tx:"#2b2b3a",sub:"#5f5f6e",ac:"#f06f6f",r:4},
{id:"poster",name:"海报",g:"dark",bg:"#121a2c",card:"#121a2c",tx:"#f0efec",sub:"#a9b3c6",ac:"#00d9ff",r:0},
{id:"github-dark",name:"GitHub 深色",g:"dark",bg:"#0d1117",card:"#0d1117",tx:"#e6edf3",sub:"#9198a1",ac:"#2f81f7",r:12},
{id:"vercel-dark",name:"Vercel",g:"dark",bg:"#0a0a0a",card:"#0a0a0a",tx:"#ededed",sub:"#a1a1a1",ac:"#ffffff",r:0},
{id:"tokyo-night",name:"Tokyo Night",g:"dark",bg:"#1a1b26",card:"#24283b",tx:"#c0caf5",sub:"#9aa5ce",ac:"#7aa2f7",r:14},
{id:"catppuccin",name:"Catppuccin",g:"dark",bg:"#24273a",card:"#1e2030",tx:"#cad3f5",sub:"#a5adcb",ac:"#c6a0f6",r:14},
{id:"synthwave",name:"合成波",g:"dark",bg:"#170a2e",card:"#1c0d38",tx:"#f5e9ff",sub:"#b9a6d6",ac:"#ff2a6d",r:18}];
class Component extends DCLogic {
constructor(p){super(p);this.state={theme:"notebook",filter:"all",scope:"page",width:1080,menu:false,footer:true,brand:true,date:true,time:true,title:true,toast:""};}
flash(m){this.setState({toast:m,menu:false});clearTimeout(this._t);this._t=setTimeout(()=>this.setState({toast:""}),2600);}
step(d){var i=THEMES.findIndex(t=>t.id===this.state.theme);this.setState({theme:THEMES[(i+d+THEMES.length)%THEMES.length].id});}
renderVals(){
var s=this.state,self=this,i=THEMES.findIndex(t=>t.id===s.theme),T=THEMES[i],dark=T.g==="dark";
var on="background:#ffffff;color:#20242c;box-shadow:0 1px 2px rgba(0,0,0,.08)",off="background:transparent;color:#526071";
var sw=function(v,dis){return{track:"background:"+(v?"#547dd0":"#d6d6d6")+";opacity:"+(dis?.45:1),knob:v?"transform:translateX(12px)":""};};
var opt=function(k,l,dis,ind){var x=sw(s[k]&&!dis,dis);return{label:l,on:!!s[k],disabled:!!dis,track:x.track,knob:x.knob,rowStyle:(ind?"padding-left:24px;":"")+(dis?"color:#8b95a3;cursor:default":""),toggle:function(){if(!dis)self.setState({[k]:!s[k]})}};};
var list=THEMES.filter(t=>s.filter==="all"||t.g===s.filter);
var now=new Date(),dd=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
var cw=s.width===720?400:s.width===1440?600:500;
return{
scopePage:s.scope==="page"?on:off,scopeSel:s.scope==="sel"?on:off,
pickPage:()=>this.setState({scope:"page"}),pickSel:()=>this.setState({scope:"sel"}),
menu:s.menu,menuBtn:s.menu?"background:#e5edfc;color:#20242c":"",toggleMenu:()=>this.setState({menu:!s.menu}),
widths:[[720,"720"],[1080,"1080"],[1440,"1440"]].map(w=>({label:w[1],style:s.width===w[0]?on:off,pick:()=>this.setState({width:w[0]})})),
opts:[opt("title","标题"),opt("footer","底部栏"),opt("brand","品牌",!s.footer,1),opt("date","日期",!s.footer,1),opt("time","时分秒",!s.footer||!s.date,1)],
filters:[["all","全部"],["light","浅色"],["dark","深色"]].map(f=>({label:f[1],style:s.filter===f[0]?on:off,pick:()=>this.setState({filter:f[0]})})),
thumbs:list.map(t=>{var a=t.id===s.theme;return{name:t.name,on:a,pick:()=>this.setState({theme:t.id}),
wrap:a?"background:#e5edfc;box-shadow:inset 0 0 0 1px #547dd0":"",
frame:"width:76px;height:56px;border-radius:6px;background:"+t.bg+";box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);display:flex;align-items:flex-end;justify-content:center;overflow:hidden",
cardBox:"width:56px;height:44px;box-sizing:border-box;background:"+t.card+";border-radius:"+Math.min(t.r,6)+"px "+Math.min(t.r,6)+"px 0 0;padding:7px 7px 0;display:flex;flex-direction:column;gap:4px"+(t.card===t.bg?";box-shadow:inset 0 0 0 1px "+(t.g==="dark"?"rgba(255,255,255,.08)":"rgba(0,0,0,.06)"):""),
line1:"height:4px;width:70%;border-radius:2px;background:"+t.tx,line2:"height:3px;width:100%;border-radius:2px;background:"+t.sub+";opacity:.6",line3:"height:3px;width:40%;border-radius:2px;background:"+t.ac};}),
themeName:T.name,pos:(i+1)+" / "+THEMES.length,prev:()=>this.step(-1),next:()=>this.step(1),
showTitle:s.title,showFooter:s.footer,showBrand:s.brand,showDate:s.date,stamp:s.time?dd+" 14:32:08":dd,
stage:"width:"+cw+"px;flex:none;background:"+T.bg+";padding:28px;box-sizing:border-box;box-shadow:0 1px 3px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.08);transition:background-color .2s,width .2s",
card:"background:"+T.card+";color:"+T.tx+";border-radius:"+T.r+"px;padding:30px 28px;font-size:14px;line-height:1.7;transition:background-color .2s,color .2s",
quote:"margin:16px 0 0;padding:2px 0 2px 12px;border-left:3px solid "+T.ac+";color:"+T.sub,
foot:"display:flex;gap:8px;margin-top:24px;padding-top:10px;border-top:1px solid "+(dark?"rgba(255,255,255,.12)":"rgba(0,0,0,.08)")+";font-size:11px;color:"+T.sub,
copy:()=>this.flash("已复制到剪贴板"),save:()=>this.flash("已保存 把周会改成异步之后.png"),toast:s.toast};
}
}
</script>
</body>
</html>
