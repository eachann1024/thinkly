<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>F 点阵成窗</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#526071}a:hover{color:#20242c}
.ff-bar{display:block;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.ff-icon{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none}
.ff-icon::after{content:"";width:15px;height:15px;border-radius:4px;border:1.5px solid color-mix(in srgb,var(--ink) 50%,transparent)}
.ff-icon-on{background:var(--paper);box-shadow:0 0 0 1px var(--line)}
.ff-dot{position:absolute;background-image:radial-gradient(circle at 7px 7px,var(--dot) 1.15px,transparent 1.7px);background-size:14px 14px}
.ff-dots{-webkit-mask:radial-gradient(circle,#000 58%,transparent 72%) center/0% 0% no-repeat;mask:radial-gradient(circle,#000 58%,transparent 72%) center/0% 0% no-repeat;animation:ff-reveal 820ms cubic-bezier(.33,1,.68,1) both,ff-out 380ms ease-out 1000ms both}
.ff-ring{animation:ff-ring 900ms cubic-bezier(.33,1,.68,1) both}
.ff-solid{animation:ff-in 420ms ease-out 720ms both}
.ff-in{animation:ff-rise 360ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--d) * 1ms)}
.ff-line{transform-origin:left center;animation:ff-line 440ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--d) * 1ms)}
.ff-caret{animation:ff-caret 1060ms steps(1) 1600ms infinite both}
@keyframes ff-reveal{to{-webkit-mask-size:320% 320%;mask-size:320% 320%}}
@keyframes ff-out{from{opacity:1}to{opacity:0}}
@keyframes ff-in{from{opacity:0}to{opacity:1}}
@keyframes ff-ring{from{opacity:.55;transform:scale(0)}to{opacity:0;transform:scale(1)}}
@keyframes ff-rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes ff-line{from{opacity:0;transform:scaleX(.35)}to{opacity:1;transform:none}}
@keyframes ff-caret{0%{opacity:1}50%{opacity:0}}
@media (max-width:760px){.ff-sidebar{display:none}.ff-main{left:0 !important}.ff-tab{left:72px !important}}
@media (prefers-reduced-motion:reduce){.ff-dots,.ff-ring{display:none}.ff-solid,.ff-in,.ff-line,.ff-caret{animation:none}}
</style>
</helmet>
<main style="--shell: {{shell}}; --side: {{side}}; --paper: {{paper}}; --ink: {{ink}}; --accent: {{accent}}; --line: {{line}}; position: relative; width: 100%; height: 100vh; min-height: 560px; margin: 0; background: var(--shell); overflow: hidden">
<div style="position: absolute; left: 16px; top: 13px; display: flex; gap: 8px">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span>
</div>
<sc-if value="{{ on }}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0">
<div class="ff-dots" style="position: absolute; inset: 0">
<span class="ff-dot" style="--dot: color-mix(in srgb, var(--ink) 30%, transparent); left: 0; top: 38px; bottom: 4px; width: 52px"></span>
<span class="ff-dot ff-sidebar" style="--dot: color-mix(in srgb, var(--ink) 34%, transparent); left: 52px; top: 38px; bottom: 4px; width: 240px; border-radius: 10px 0 0 10px"></span>
<span class="ff-dot" style="--dot: color-mix(in srgb, var(--ink) 16%, transparent); left: 292px; top: 38px; right: 4px; bottom: 4px; border-radius: 0 10px 10px 0"></span>
<span style="position: absolute; left: 52px; top: 38px; right: 4px; bottom: 4px; border-radius: 10px; box-shadow: 0 0 0 1.25px var(--accent)"></span>
</div>
<span class="ff-ring" style="position: absolute; left: 50%; top: 50%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--accent)"></span>
<div style="position: absolute; left: 92px; top: 12px; display: flex; gap: 14px">
<span class="ff-bar ff-in" style="--d: 760; width: 14px; height: 14px; border-radius: 4px"></span>
<span class="ff-bar ff-in" style="--d: 790; width: 14px; height: 14px; border-radius: 4px"></span>
<span class="ff-bar ff-in" style="--d: 820; width: 14px; height: 14px; border-radius: 4px"></span>
</div>
<span class="ff-bar ff-in ff-tab" style="--d: 860; position: absolute; left: 320px; top: 15px; width: 64px; height: 8px"></span>
<div style="position: absolute; left: 0; top: 38px; bottom: 8px; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px; box-sizing: border-box">
<span class="ff-icon ff-icon-on ff-in" style="--d: 760"></span>
<span class="ff-icon ff-in" style="--d: 800"></span>
<span class="ff-icon ff-in" style="--d: 840"></span>
<span style="flex: 1"></span>
<span class="ff-icon ff-in" style="--d: 880"></span>
<span class="ff-icon ff-in" style="--d: 920"></span>
<span class="ff-icon ff-in" style="--d: 960"></span>
</div>
<div class="ff-solid" style="position: absolute; left: 52px; top: 38px; right: 4px; bottom: 4px; border-radius: 10px; overflow: hidden; background: var(--paper); box-shadow: 0 0 0 1px var(--line)">
<div class="ff-sidebar" style="position: absolute; left: 0; top: 0; bottom: 0; width: 240px; box-sizing: border-box; background: var(--side); border-right: 1px solid var(--line); padding: 20px 16px; display: flex; flex-direction: column; gap: 22px">
<span class="ff-bar ff-in" style="--d: 880; width: 96px; height: 8px"></span>
<span class="ff-bar ff-in" style="--d: 920; width: 84px; height: 8px; margin-left: 18px"></span>
<span class="ff-bar ff-in" style="--d: 960; width: 64px; height: 8px; margin-left: 18px"></span>
<span class="ff-bar ff-in" style="--d: 1000; width: 112px; height: 8px; margin-left: 18px"></span>
<span class="ff-in" style="--d: 1060; display: flex; align-items: center; height: 36px; margin: -10px -2px 0; padding: 0 12px; border-radius: 8px; box-shadow: inset 0 0 0 1.5px var(--accent)"><span class="ff-bar" style="width: 60px; height: 8px"></span></span>
</div>
<div class="ff-main" style="position: absolute; left: 240px; right: 0; top: 0; bottom: 0; display: flex; justify-content: center; padding: 40px 48px 0">
<div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 16px">
<span class="ff-bar ff-line" style="--d: 940; width: 34%; height: 22px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 16%, transparent)"></span>
<span class="ff-bar ff-line" style="--d: 1000; width: 10%; height: 12px; margin-top: 10px"></span>
<span class="ff-bar ff-line" style="--d: 1040; width: 96%; height: 8px"></span>
<span class="ff-bar ff-line" style="--d: 1080; width: 88%; height: 8px"></span>
<span class="ff-bar ff-line" style="--d: 1120; width: 92%; height: 8px"></span>
<span class="ff-bar ff-line" style="--d: 1160; width: 58%; height: 8px"></span>
<span class="ff-bar ff-line" style="--d: 1200; width: 10%; height: 12px; margin-top: 10px"></span>
<span class="ff-bar ff-line" style="--d: 1240; width: 84%; height: 8px"></span>
<span class="ff-bar ff-line" style="--d: 1280; width: 70%; height: 8px"></span>
<span class="ff-caret" style="width: 2px; height: 20px; border-radius: 1px; background: var(--accent)"></span>
</div>
</div>
</div>
</div>
</sc-if>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">正在打开 Thinkly</span>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
state = { on: true };
componentDidMount() {
this.loop = setInterval(() => {
this.setState({ on: false });
this.back = setTimeout(() => this.setState({ on: true }), 450);
}, 4200);
}
componentWillUnmount() {
clearInterval(this.loop);
clearTimeout(this.back);
}
renderVals() {
const d = this.props.dark;
const dark = d === true || d === 'true';
const theme = dark
? { shell: '#343434', side: '#222222', paper: '#181818', ink: '#ececec', accent: '#779de8', line: 'rgba(236,236,236,.12)' }
: { shell: '#f1f1f1', side: '#fafafa', paper: '#ffffff', ink: '#20242c', accent: '#547dd0', line: 'rgba(32,36,44,.08)' };
return { ...theme, on: this.state.on };
}
}
</script>
</body>
</html>
