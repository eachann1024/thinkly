<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>B 轮廓落位</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#526071}a:hover{color:#20242c}
.b-root{--cycle:4.8s}
.b-trace{stroke-dasharray:1;stroke-dashoffset:1;animation:b-trace var(--cycle) cubic-bezier(.65,0,.35,1) infinite}
.b-divider{transform-box:fill-box;transform-origin:top;transform:scaleY(0);animation:b-divider var(--cycle) cubic-bezier(.22,1,.36,1) infinite}
.b-side{opacity:0;animation:b-fade var(--cycle) ease-out infinite;animation-delay:calc(var(--i) * 60ms)}
.b-line{transform-box:fill-box;transform-origin:left;opacity:0;transform:scaleX(.2);animation:b-line var(--cycle) cubic-bezier(.22,1,.36,1) infinite;animation-delay:calc(var(--i) * 70ms)}
.b-col{transform:translateX(124px)}
.b-all{animation:b-all var(--cycle) ease-in-out infinite}
@keyframes b-trace{0%{stroke-dashoffset:1;opacity:1}28%{stroke-dashoffset:0;opacity:1}60%{opacity:1}76%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes b-divider{0%,18%{transform:scaleY(0)}34%,100%{transform:scaleY(1)}}
@keyframes b-fade{0%,28%{opacity:0}40%,100%{opacity:1}}
@keyframes b-line{0%,30%{opacity:0;transform:scaleX(.2)}46%,100%{opacity:1;transform:scaleX(1)}}
@keyframes b-all{0%,84%{opacity:1}96%,100%{opacity:0}}
@media (max-width:720px){.b-sidebar{display:none}.b-col{transform:none}}
@media (prefers-reduced-motion:reduce){.b-trace,.b-divider,.b-side,.b-line,.b-all{animation:none}.b-trace{stroke-dashoffset:0;opacity:0}.b-divider{transform:none}.b-side,.b-line{opacity:1;transform:none}}
</style>
</helmet>
<main class="b-root" style="--shell: {{shell}}; --paper: {{paper}}; --ink: {{ink}}; --accent: {{accent}}; width: 100%; height: 100vh; min-height: 480px; margin: 0; background: var(--paper); overflow: hidden; position: relative">
<svg width="100%" height="100%" aria-hidden="true" style="display: block; position: absolute; inset: 0">
<g class="b-all">
<g class="b-sidebar">
<rect width="248" height="100%" style="fill: var(--shell)" class="b-side"></rect>
<rect class="b-side" style="--i: 0; fill: var(--ink); fill-opacity: .1" x="20" y="56" width="132" height="8" rx="4"></rect>
<rect class="b-side" style="--i: 1; fill: var(--ink)" x="20" y="88" width="168" height="8" rx="4" fill-opacity=".08"></rect>
<rect class="b-side" style="--i: 2; fill: var(--ink)" x="20" y="116" width="120" height="8" rx="4" fill-opacity=".08"></rect>
<rect class="b-side" style="--i: 3; fill: var(--ink)" x="20" y="144" width="150" height="8" rx="4" fill-opacity=".08"></rect>
<rect class="b-side" style="--i: 4; fill: var(--ink)" x="20" y="172" width="104" height="8" rx="4" fill-opacity=".08"></rect>
<line class="b-divider" x1="248" y1="0" x2="248" y2="100%" stroke-width="1" style="stroke: var(--accent)"></line>
</g>
<svg x="50%" y="0" overflow="visible">
<g class="b-col">
<rect class="b-line" style="--i: 0; fill: var(--ink)" x="-300" y="120" width="320" height="14" rx="7" fill-opacity=".14"></rect>
<rect class="b-line" style="--i: 1; fill: var(--ink)" x="-300" y="168" width="600" height="8" rx="4" fill-opacity=".08"></rect>
<rect class="b-line" style="--i: 2; fill: var(--ink)" x="-300" y="192" width="560" height="8" rx="4" fill-opacity=".08"></rect>
<rect class="b-line" style="--i: 3; fill: var(--ink)" x="-300" y="216" width="584" height="8" rx="4" fill-opacity=".08"></rect>
<rect class="b-line" style="--i: 4; fill: var(--ink)" x="-300" y="240" width="380" height="8" rx="4" fill-opacity=".08"></rect>
<rect class="b-line" style="--i: 5; fill: var(--accent)" x="-300" y="276" width="2" height="18" rx="1"></rect>
</g>
</svg>
<rect class="b-trace" x="0.5" y="0.5" width="99.9%" height="99.9%" rx="10" pathLength="1" fill="none" stroke-width="1" style="stroke: var(--accent)"></rect>
</g>
</svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">正在打开 Thinkly</span>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return dark
? { shell: '#222222', paper: '#181818', ink: '#ececec', accent: '#779de8' }
: { shell: '#fafafa', paper: '#ffffff', ink: '#20242c', accent: '#547dd0' };
}
}
</script>
</body>
</html>
