<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>D 整窗升起</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#526071}a:hover{color:#20242c}
.fr-bar{display:block;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.fr-icon{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none}
.fr-icon::after{content:"";width:15px;height:15px;border-radius:4px;border:1.5px solid color-mix(in srgb,var(--ink) 50%,transparent)}
.fr-icon-on{background:var(--paper);box-shadow:0 0 0 1px var(--line)}
.fr-rise{animation:fr-rise 420ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--d) * 1ms)}
.fr-panel{transform-origin:50% 0;animation:fr-panel 560ms cubic-bezier(.16,1,.3,1) 120ms both}
.fr-side{animation:fr-side 480ms cubic-bezier(.16,1,.3,1) 260ms both}
.fr-line{transform-origin:left center;animation:fr-line 460ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--d) * 1ms)}
.fr-caret{animation:fr-caret 1060ms steps(1) 1300ms infinite both}
@keyframes fr-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fr-panel{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fr-side{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes fr-line{from{opacity:0;transform:scaleX(.35)}to{opacity:1;transform:none}}
@keyframes fr-caret{0%{opacity:1}50%{opacity:0}}
@media (max-width:760px){.fr-sidebar{display:none}.fr-main{left:0 !important}.fr-tab{left:72px !important}}
@media (prefers-reduced-motion:reduce){.fr-rise,.fr-panel,.fr-side,.fr-line,.fr-caret{animation:none}}
</style>
</helmet>
<main style="--shell: {{shell}}; --side: {{side}}; --paper: {{paper}}; --ink: {{ink}}; --accent: {{accent}}; --line: {{line}}; position: relative; width: 100%; height: 100vh; min-height: 560px; margin: 0; background: var(--shell); overflow: hidden">
<div style="position: absolute; left: 16px; top: 13px; display: flex; gap: 8px">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span>
</div>
<sc-if value="{{ on }}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0">
<div style="position: absolute; left: 92px; top: 12px; display: flex; gap: 14px">
<span class="fr-bar fr-rise" style="--d: 40; width: 14px; height: 14px; border-radius: 4px"></span>
<span class="fr-bar fr-rise" style="--d: 70; width: 14px; height: 14px; border-radius: 4px"></span>
<span class="fr-bar fr-rise" style="--d: 100; width: 14px; height: 14px; border-radius: 4px"></span>
</div>
<span class="fr-bar fr-rise fr-tab" style="--d: 420; position: absolute; left: 320px; top: 15px; width: 64px; height: 8px"></span>
<div style="position: absolute; left: 0; top: 38px; bottom: 8px; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px; box-sizing: border-box">
<span class="fr-icon fr-icon-on fr-rise" style="--d: 80"></span>
<span class="fr-icon fr-rise" style="--d: 120"></span>
<span class="fr-icon fr-rise" style="--d: 160"></span>
<span style="flex: 1"></span>
<span class="fr-icon fr-rise" style="--d: 200"></span>
<span class="fr-icon fr-rise" style="--d: 240"></span>
<span class="fr-icon fr-rise" style="--d: 280"></span>
</div>
<div class="fr-panel" style="position: absolute; left: 52px; top: 38px; right: 4px; bottom: 4px; border-radius: 10px; overflow: hidden; background: var(--paper); box-shadow: 0 0 0 1px var(--line)">
<div class="fr-sidebar fr-side" style="position: absolute; left: 0; top: 0; bottom: 0; width: 240px; box-sizing: border-box; background: var(--side); border-right: 1px solid var(--line); padding: 20px 16px; display: flex; flex-direction: column; gap: 22px">
<span class="fr-bar fr-rise" style="--d: 420; width: 96px; height: 8px"></span>
<span class="fr-bar fr-rise" style="--d: 470; width: 84px; height: 8px; margin-left: 18px"></span>
<span class="fr-bar fr-rise" style="--d: 510; width: 64px; height: 8px; margin-left: 18px"></span>
<span class="fr-bar fr-rise" style="--d: 550; width: 112px; height: 8px; margin-left: 18px"></span>
<span class="fr-rise" style="--d: 600; display: flex; align-items: center; height: 36px; margin: -10px -2px 0; padding: 0 12px; border-radius: 8px; box-shadow: inset 0 0 0 1.5px var(--accent)"><span class="fr-bar" style="width: 60px; height: 8px"></span></span>
</div>
<div class="fr-main" style="position: absolute; left: 240px; right: 0; top: 0; bottom: 0; display: flex; justify-content: center; padding: 40px 48px 0">
<div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 16px">
<span class="fr-bar fr-line" style="--d: 520; width: 34%; height: 22px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 16%, transparent)"></span>
<span class="fr-bar fr-line" style="--d: 580; width: 10%; height: 12px; margin-top: 10px"></span>
<span class="fr-bar fr-line" style="--d: 620; width: 96%; height: 8px"></span>
<span class="fr-bar fr-line" style="--d: 660; width: 88%; height: 8px"></span>
<span class="fr-bar fr-line" style="--d: 700; width: 92%; height: 8px"></span>
<span class="fr-bar fr-line" style="--d: 740; width: 58%; height: 8px"></span>
<span class="fr-bar fr-line" style="--d: 780; width: 10%; height: 12px; margin-top: 10px"></span>
<span class="fr-bar fr-line" style="--d: 820; width: 84%; height: 8px"></span>
<span class="fr-bar fr-line" style="--d: 860; width: 70%; height: 8px"></span>
<span class="fr-caret" style="width: 2px; height: 20px; border-radius: 1px; background: var(--accent)"></span>
</div>
</div>
</div>
</div>
</sc-if>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">正在打开 Thinkly</span>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
state = { on: true };
componentDidMount() {
this.loop = setInterval(() => {
this.setState({ on: false });
this.back = setTimeout(() => this.setState({ on: true }), 450);
}, 4200);
}
componentWillUnmount() {
clearInterval(this.loop);
clearTimeout(this.back);
}
renderVals() {
const d = this.props.dark;
const dark = d === true || d === 'true';
const theme = dark
? { shell: '#343434', side: '#222222', paper: '#181818', ink: '#ececec', accent: '#779de8', line: 'rgba(236,236,236,.12)' }
: { shell: '#f1f1f1', side: '#fafafa', paper: '#ffffff', ink: '#20242c', accent: '#547dd0', line: 'rgba(32,36,44,.08)' };
return { ...theme, on: this.state.on };
}
}
</script>
</body>
</html>
