<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>C 墨滴铺纸</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#526071}a:hover{color:#20242c}
.c-root{--cycle:4.8s}
.c-drop{animation:c-drop var(--cycle) cubic-bezier(.55,0,.85,.35) infinite}
.c-drop-shape{transform-box:fill-box;transform-origin:center bottom;animation:c-squish var(--cycle) ease-out infinite}
.c-paper{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:c-paper var(--cycle) cubic-bezier(.16,1,.3,1) infinite}
.c-ring{transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;animation:c-ring var(--cycle) cubic-bezier(.16,1,.3,1) infinite;animation-delay:calc(var(--i) * 140ms)}
.c-all{animation:c-all var(--cycle) ease-in-out infinite}
@keyframes c-drop{0%{transform:translateY(-52vh);opacity:0}4%{opacity:1}18%{transform:translateY(0);opacity:1}40%{transform:translateY(0);opacity:1}52%,100%{transform:translateY(0);opacity:0}}
@keyframes c-squish{0%,17%{transform:scale(.8,1.25)}21%{transform:scale(1.5,.55)}27%{transform:scale(.92,1.08)}32%,100%{transform:scale(1)}}
@keyframes c-paper{0%,18%{transform:scale(0)}64%,100%{transform:scale(1)}}
@keyframes c-ring{0%,18%{transform:scale(.01);opacity:0}20%{opacity:.7}58%{transform:scale(1);opacity:0}100%{transform:scale(1);opacity:0}}
@keyframes c-all{0%,84%{opacity:1}96%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.c-drop,.c-drop-shape,.c-paper,.c-ring,.c-all{animation:none}.c-paper{transform:none}.c-drop{opacity:0}}
</style>
</helmet>
<main class="c-root" style="--shell: {{shell}}; --paper: {{paper}}; --accent: {{accent}}; width: 100%; height: 100vh; min-height: 480px; margin: 0; background: var(--shell); overflow: hidden; position: relative">
<svg width="100%" height="100%" aria-hidden="true" style="display: block; position: absolute; inset: 0">
<g class="c-all">
<circle class="c-paper" cx="50%" cy="50%" r="71%" style="fill: var(--paper)"></circle>
<circle class="c-ring" style="--i: 0; stroke: var(--accent)" cx="50%" cy="50%" r="71%" fill="none" stroke-width="1.25" vector-effect="non-scaling-stroke"></circle>
<circle class="c-ring" style="--i: 1; stroke: var(--accent)" cx="50%" cy="50%" r="71%" fill="none" stroke-width="1" vector-effect="non-scaling-stroke"></circle>
<circle class="c-ring" style="--i: 2; stroke: var(--accent)" cx="50%" cy="50%" r="71%" fill="none" stroke-width=".75" vector-effect="non-scaling-stroke"></circle>
<svg x="50%" y="50%" overflow="visible">
<g class="c-drop">
<circle class="c-drop-shape" cx="0" cy="0" r="5" style="fill: var(--accent)"></circle>
</g>
</svg>
</g>
</svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">正在打开 Thinkly</span>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
return dark
? { shell: '#343434', paper: '#181818', accent: '#779de8' }
: { shell: '#f1f1f1', paper: '#ffffff', accent: '#547dd0' };
}
}
</script>
</body>
</html>
