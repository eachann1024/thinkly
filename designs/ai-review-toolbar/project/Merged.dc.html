<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>改动预览 B 一个复制菜单</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tab{font:inherit;font-size:13px;border:0;border-radius:7px;padding:6px 10px;background:transparent;color:#b4b4b4;cursor:pointer}
.tab.on{background:#2c2c2c;color:#ececec}
.act{display:flex;align-items:center;gap:6px;font:inherit;font-size:13px;border:0;border-radius:7px;padding:6px 10px;background:#2c2c2c;color:#ececec;cursor:pointer}
.item{display:flex;align-items:center;gap:8px;width:100%;font:inherit;font-size:13px;border:0;border-radius:6px;padding:8px 10px;background:transparent;color:#ececec;text-align:left;cursor:pointer}
.item:hover{background:#2c2c2c}
td,th{padding:10px 8px;text-align:left;font-weight:400;border-bottom:1px solid #2e2e2e;white-space:nowrap}
th{color:#b4b4b4;font-size:13px}
</style>
</helmet>
<div style="width:560px;height:700px;box-sizing:border-box;padding:20px;background:#181818;font-family:-apple-system,'PingFang SC',system-ui,sans-serif;color:#ececec">
<div style="background:#1f1f1f;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px">

<div style="display:flex;align-items:center;gap:8px;color:#8fd4a0;font-size:15px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>已应用
</div>
<div style="display:flex;align-items:center;gap:10px;background:#2c2c2c;border-radius:8px;padding:10px 12px;font-size:14px;color:#b4b4b4">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>执行过程<span style="margin-left:auto">50.6 秒</span>
</div>

<p style="margin:4px 0 0;font-size:15px;font-weight:600;line-height:1.55">重构页面，移除 JSON 代码块与多余指引，保留并优化为账号总览与工具表格。</p>

<div style="display:flex;align-items:center;gap:4px;position:relative">
<div role="radiogroup" aria-label="预览方式" style="display:flex;gap:2px">
<button class="tab on" role="radio" aria-checked="true">正文</button>
<button class="tab" role="radio" aria-checked="false">差异</button>
</div>
<span style="margin-left:auto;font-size:12px;color:#8fd4a0;display:flex;align-items:center;gap:4px" role="status"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>原文已复制</span>
<button class="act" aria-haspopup="menu" aria-expanded="true" style="margin-left:8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>复制<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
<div role="menu" style="position:absolute;right:0;top:40px;width:180px;padding:4px;border-radius:10px;background:#222222;border:1px solid #343434;z-index:2">
<button class="item" role="menuitem">复制新内容<span style="margin-left:auto;font-size:12px;color:#8a8a8a">默认</span></button>
<button class="item" role="menuitem">复制原文</button>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:20px;font-weight:600">账号总览清单</div>
<div style="border-radius:10px;background:#262626;overflow:hidden;font-size:13px">
<table style="width:100%;border-collapse:collapse">
<tr><th>#</th><th>账号</th><th>2FA</th><th>到期</th></tr>
<tr><td>1</td><td>[账号 1]</td><td>[密钥]</td><td>[日期]</td></tr>
<tr><td>2</td><td>[账号 2]</td><td>[密钥]</td><td>[日期]</td></tr>
<tr><td style="border:0">3</td><td style="border:0">[账号 3]</td><td style="border:0">[密钥]</td><td style="border:0">[日期]</td></tr>
</table>
</div>
</div>

</div>
</div>
</x-dc>

</body>
</html>
