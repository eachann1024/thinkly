<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>鹅笔记 · 四套侧栏图标</title>
    <link rel="stylesheet" href="preview.css" />
    <script src="icon-sets.js" defer></script>
    <script src="preview.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="brand">鹅笔记 / 图标选择</p>
        <div class="heading-row">
          <h1>只留图标。</h1>
          <div class="controls">
            <div class="theme-controls" role="group" aria-label="预览主题">
              <button type="button" data-theme-value="dark" aria-pressed="true">深色</button>
              <button type="button" data-theme-value="light" aria-pressed="false">浅色</button>
            </div>
            <label class="size-control">图标
              <select id="icon-size" aria-label="图标预览尺寸">
                <option value="20">20 px</option>
                <option value="24" selected>24 px</option>
                <option value="28">28 px</option>
              </select>
            </label>
          </div>
        </div>
        <p class="intro">未选中空心，选中实心。点击任意侧栏，对比四套效果。</p>
      </header>
      <div id="options" class="options" aria-label="四套图标方案"></div>
      <p id="selection" class="selection" role="status" aria-live="polite">选一套，再接入鹅笔记。</p>
      <footer>ChatGPT 生成原图与 SVG · 本地、大纲、搜索、设置 · 4 套 / 32 个状态</footer>
      <noscript>请启用 JavaScript 查看可交互的 SVG 预览。四张原图位于本目录的 set-1-raw.png 至 set-4-raw.png。</noscript>
    </main>
    <dialog id="original-dialog" aria-labelledby="original-title">
      <div class="dialog-header">
        <h2 id="original-title">ChatGPT 原图</h2>
        <form method="dialog"><button type="submit" aria-label="关闭原图">关闭</button></form>
      </div>
      <img id="original-image" alt="ChatGPT 生成的空心与实心配套图标" />
    </dialog>
  </body>
</html>
